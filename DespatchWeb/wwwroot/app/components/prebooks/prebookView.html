<div class="top-bar">
    <img src="/images/menu-urgent.png" class="logo" />

    <div class="topbar-NavButtons" role="navigation">
        <div class="btn btn-sm btn-nav topbar-button" ui-sref="home" ui-sref-active="topbar-active">Dispatch</div>
        <div class="btn btn-sm btn-nav topbar-button" ui-sref="nw" ui-sref-active="topbar-active">Nationwide</div>
        <div class="btn btn-sm btn-nav topbar-button" ui-sref="cs" ui-sref-active="topbar-active">POD/Search</div>
        <div class="btn btn-sm btn-nav topbar-button" ui-sref="prebooks" ui-sref-active="topbar-active">PreBooks</div>
    </div>
</div>

<div class="">

    <div class="columns">

        <div class="column" id="co-{{column.id}}" ng-repeat="(colKey,column) in layout.columns" r-directions="['right']"
             r-flex="true" resizable style="flex-basis: {{column.width}}">
            <div class="column-sortable" ng-model="column.boxes" ui-sortable="sortableOptions">
                <div class="box" id="box-{{box.name}}" ng-repeat="(boxName,box) in column.boxes"
                     r-directions="['bottom']"
                     r-flex="true" resizable style="flex-basis: {{box.height}}">

                <div class="box-bar">
                        <div class="box-bar-title">{{boxes[box.name].title}}  <span ng-show="box.name == 'scanList'">{{currentSelection}}</span>  </div>
                        <div class="searchBox"  ng-show="box.name == 'eventList'">
                            <input type="text" ng-model="searchBox" placeholder="Search Events..." />
                            <div class="results" ng-show="searchBox">
                                <ul>
                                    <li class="result" ng-repeat="event in filteredEvents = ( allEvents | filter: searchBox) | limitTo:10" ng-mousedown="selectEvent(event)">{{event.jobNumber}}<br /> <small class="address">{{event.courierName}} {{event.courierCode}}</small></li>
                                </ul>
                                <small ng-hide="filteredEvents.length">No results</small>
                            </div>
                        </div>
                        <div class="box-buttons">

                            <div class="box-details" ng-show="box.name == 'eventList'">
                                <label class="checkbox-inline">
                                    <input type="checkbox" ng-model="pickDateService.includeClosed" ng-change="refreshData(true)" value="All">
                                    Include Closed?
                                </label>
                                <label ng-show="isAdmin" class="checkbox-inline">
                                    <input type="radio" ng-model="followupClient.name" ng-change="refreshData(true)" value="All">
                                    All
                                </label>
                                <label ng-show="isAdmin" class="checkbox-inline">
                                    <input type="radio" ng-model="followupClient.name" ng-change="refreshData(true)" value="UCL">
                                    UCL
                                </label>
                                <label ng-show="isAdmin" class="checkbox-inline">
                                    <input type="radio" ng-model="followupClient.name" ng-change="refreshData(true)" value="Client">
                                    Client
                                </label>


                                <!--<span>{{currentDate | date : "dd/MM/yyyy"}}</span>-->
                                <div class="btn-group" role="group" aria-label="Basic example">
                                    ri
F
                                      <!--<button type="button" class="btn btn-sm btn-secondary" title="Choose Date" ng-click="chooseDate()"><i class="fa fa-calendar-alt"></i></button>-->
                                </div>


                            </div>


                            <div class="box-details" ng-show="box.name == 'runBuilder'">


                            </div>


                            <div class="box-details" ng-show="box.name == 'jobDetail'">
                                <div class="btn-group" role="group" aria-label="Basic example">
                                    <button type="button" class="btn btn-sm btn-secondary" title="Reply" ng-show="currentEvent && !currentEvent.closedDate" ng-click="reply(currentEvent)"><i class="fa fa-reply"></i></button>
                                </div>
                                <div class="btn-group" role="group" aria-label="Basic example">
                                    <button type="button" class="btn btn-sm btn-secondary" title="Copy Link" ng-show="currentEvent && ((isAdmin && !currentEvent.internal) || (!isAdmin && !currentEvent.internal))" ng-click="generateDirectLink(currentEvent)"><i class="fa fa-link"></i></button>
                                </div>
                                <div class="btn-group" role="group" aria-label="Basic example">
                                    <button type="button" class="btn btn-sm btn-secondary" title="Email Photo POD" ng-show="currentJob" ng-click="sendPOD()"><i class="fa fa-mail-forward"></i></button>
                                </div>
                            </div>

                            <div class="box-details" ng-show="box.name == 'map'">

                            </div>

                            <div class="btn btn-sm btn-primary box-refresh" ng-show="boxes[box.name].showRefresh" ng-click="refreshData()"><i class="fa fa-refresh"></i></div>
                            <div class="box-search" ng-show="boxes[box.name].showSearch"><i class="fa fa-search" ng-click="openSearch(box.name)"></i> <input type="text" ng-model="box.searchBox" placeholder="Search..." ng-model-options="{debounce: 300}"></div>
                            <div class="box-handle"><i class="fa fa-ellipsis-v"></i> </div>
                        </div>
                    </div>
                    <div class="box-content" ng-include="boxes[box.name].tpl"></div>
                </div>

            </div>
        </div>

    </div>

</div>

<div ng-include="'app/components/home/tpls/gatherForm.tpl'"></div>

<div ng-include="'app/components/home/tpls/gatherFormMulti.tpl'"></div>


<div id='draggingItems'></div>
