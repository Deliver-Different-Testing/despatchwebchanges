<link href="app/components/overview/mega-map/mega-map.styles.css" rel="stylesheet">
<!-- Main Map Container -->
<div class="map-container">
    <ng-map center="{{ctrl.mapCenter}}"
            fullscreen-control="false"
            default-style="false"
            street-view-control="false"
            map-type-control="false"
            style="height: 100vh !important; width: 100% !important;"
            zoom="5"
            zoom-control="true"
            zoom-control-options="{position: 'RIGHT_BOTTOM'}">

        <!-- Driver Markers -->
        <custom-marker ng-repeat="driver in ctrl.drivers"
                       on-click="ctrl.showDriverInfo(driver, $event)"
                       position="[[driver.lat, driver.lng]]">
            <div class="driver-marker">
                <i class="material-symbols-outlined" style="color: #2196F3;">navigation</i>
            </div>
        </custom-marker>

        <!-- Pickup Points -->
        <marker icon="https://maps.google.com/mapfiles/ms/icons/green-dot.png"
                ng-repeat="point in ctrl.pickupPoints"
                on-click="ctrl.showPickupInfo(point, $event)"
                position="[[point.lat, point.lng]]">
        </marker>

        <!-- Delivery Points -->
        <marker icon="https://maps.google.com/mapfiles/ms/icons/red-dot.png"
                ng-repeat="point in ctrl.deliveryPoints"
                on-click="ctrl.showDeliveryInfo(point, $event)"
                position="[[point.lat, point.lng]]">
        </marker>
    </ng-map>

    <!-- Active Drivers Panel -->
    <md-card class="active-drivers">
        <h2 class="md-title">Active Drivers</h2>
        <md-list class="driver-list">
            <md-list-item ng-click="ctrl.centerOnDriver(driver)"
                          ng-repeat="driver in ctrl.drivers">
                <div class="md-list-item-text">
                    <h3>{{driver.name}}</h3>
                    <p>{{driver.status}}</p>
                </div>
            </md-list-item>
        </md-list>
    </md-card>

    <!-- Map Legend -->
    <div class="map-legend">
        <h3>Map Legend</h3>
        <div class="legend-item">
            <i class="material-symbols-outlined" style="color: #2196F3;">navigation</i>
            <span>Drivers</span>
        </div>
        <div class="legend-item">
            <img src="https://maps.google.com/mapfiles/ms/icons/green-dot.png">
            <span>Pickup Points</span>
        </div>
        <div class="legend-item">
            <img src="https://maps.google.com/mapfiles/ms/icons/red-dot.png">
            <span>Delivery Points</span>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" ng-if="ctrl.isLoading">
        <md-progress-circular md-mode="indeterminate"></md-progress-circular>
    </div>
</div>

<!-- Floating Refresh Button -->
<nav active-icon="refresh"
     label="Refresh Map"
     main-action="ctrl.refreshData()"
     mfb-menu
     position="br"
     resting-icon="refresh"
     template-url="ng-mfb-menu-md.tpl.html">
</nav>
