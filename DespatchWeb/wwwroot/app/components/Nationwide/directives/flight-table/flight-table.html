<div class="responsive-datatable">
    <md-progress-circular md-mode="indeterminate" ng-if="loading"></md-progress-circular>
    <md-content class="md-warn" ng-if="error">{{ error }}</md-content>
    <md-table-container ng-if="!loading && !error">
        <table md-table>
            <thead md-head>
            <tr md-row>
                <th md-column>Airline</th>
                <th md-column>Flight Number</th>
                <th md-column>Departure Time</th>
                <th md-column>Arrival Time</th>
                <th md-column>Duration</th>
                <th md-column>Aircraft</th>
            </tr>
            </thead>
            <tbody md-body>
            <tr md-row ng-repeat="flight in flights">
                <td md-cell>{{ flight.airline }}</td>
                <td md-cell>{{ flight.flightNumber }}</td>
                <td md-cell>{{ flight.departureTime | date:'short' }}</td>
                <td md-cell>{{ flight.arrivalTime | date:'short' }}</td>
                <td md-cell>{{ flight.duration | date:'H:mm' }}</td>
                <td md-cell>{{ flight.aircraft }}</td>
            </tr>
            </tbody>
        </table>
    </md-table-container>
</div>
