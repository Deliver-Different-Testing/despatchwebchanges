<md-table-container>
    <table md-progress="promise" md-row-select md-table ng-model="selected">
        <thead md-head md-order="sort.jobList">
        <tr md-row>
            <th md-column md-order-by="time"><span>Time</span></th>
            <th md-column md-order-by="speed"><span>Speed</span></th>
            <th md-column md-order-by="jobno"><span>Job No</span></th>
            <th md-column md-order-by="client"><span>Client</span></th>
            <th md-column md-order-by="from"><span>From</span></th>
            <th md-column md-order-by="to"><span>To</span></th>
            <th md-column md-order-by="courier"><span>Courier</span></th>
            <th md-column md-order-by="pod"><span>POD</span></th>
            <th md-column md-order-by="remain"><span>Remain</span></th>
            <th md-column md-order-by="status"><span>S</span></th>
            <th md-column></th>
            <th md-column>E</th>
            <th md-column>R</th>
        </tr>
        </thead>
        <tbody md-body>
        <tr md-row md-select="job" md-select-id="id" ng-repeat="job in jobList | filter: box.searchBox">
            <td md-cell>{{job.time | date: "HH:mm"}}</td>
            <td md-cell ng-click="speedColumnClick($event)" ng-right-click>{{job.speed}}</td>
            <td md-cell ng-context-menu="setEventsMenu">{{job.jobNo}}</td>
            <td md-cell ng-click="clientColumnClick($event)" ng-right-click>{{job.client}}</td>
            <td md-cell ng-click="fromColumnClick($event)" ng-right-click
                style="width:50px; white-space:nowrap; overflow-x:hidden;">{{job.from}}
            </td>
            <td md-cell ng-click="toColumnClick($event)" ng-right-click>{{job.to}}</td>
            <td md-cell>
                <input class="dispatchField" ng-keydown="$event.keyCode === 13 && dispatchJobsFromNew(job.courier)"
                       ng-model="job.courier"
                       ng-readonly="job.courierData.courierID !== null"
                       ng-style="getJobStyle(job.courierData.courierID !== null)"
                       placeholder="" type="text"/>
            </td>
            <td md-cell>{{job.pod}}</td>
            <td md-cell><span ng-style='{"color":"darkorange", "font-weight": "bold"}'>{{job.remain}}</span></td>
            <td class="status" md-cell ng-class="job.status">{{job.status}}</td>
            <td class="selectjob" md-cell ng-click="selectForDispatch(job); $event.stopPropagation();"
                style="display:none" title="placeholder selector"></td>
            <td md-cell ng-click="createEvent();" style="width:20px;" title="Create Event">
                <md-icon>calendar_add_on</md-icon>
            </td>
            <td md-cell ng-click="job.courier == null || restoreJobsFromNew();" style="width:20px;" title="Restore">
                <md-icon ng-if="job.courier !== null">undo</md-icon>
            </td>
        </tr>
        </tbody>
    </table>
</md-table-container>

<div layout="row" layout-align="space-around" layout-sm="column" ng-show="isLoading">
    <md-progress-circular md-mode="indeterminate"></md-progress-circular>
</div>
