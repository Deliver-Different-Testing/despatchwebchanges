<div class="gatherForm" id="{{gather.form.id}}" ng-if="gather.form.tpl != 'multi'">
    <div class="gatherFields">
        <div class="gatherTitle">{{gather.form.title}}</div>
        <div class="gatherField" ng-repeat="field in gather.form.fields"
             style="display:inline-block; {{field.cssExtras}}">
            <div ng-switch="field.type">
                <div ng-switch-default>
                    <input class="form-control focusMe" id="gather-{{field.name}}" maxLength="{{field.maxLength}}" name="{{field.name}}"
                           ng-model="field.value" placeholder="{{field.label}}" type="text"/>
                </div>
                <div ng-switch-when="textarea">
                    <textarea class="form-control focusMe" id="gather-{{field.name}}" name="{{field.name}}"
                              ng-model="field.value" placeholder="{{field.label}}"></textarea>
                </div>
                <div ng-switch-when="sms">
                    <textarea class="form-control focusMe" id="gather-{{field.name}}" maxlength="160"
                              name="{{field.name}}" ng-model="field.value" placeholder="{{field.label}}"></textarea>
                </div>
                <div ng-switch-when="time">
                    <input class="form-control focusMe" id="gather-{{field.name}}" name="{{field.name}}" ng-model="field.value"
                           placeholder="{{field.label}}" type="time"/>
                </div>
                <div ng-switch-when="date">
                    <input class="form-control focusMe" id="gather-{{field.name}}" name="{{field.name}}" ng-model="field.value"
                           placeholder="{{field.label}}" type="date"/>
                </div>
                <div ng-switch-when="checkbox" style="background-color:lightgray">
                    <input class="form-control" id="gather-{{field.name}}" name="{{field.name}}" ng-model="field.value"
                           style="width:20px;height:20px;background-color:lightgray;font-size:21px;display:inline-block;"
                           type="checkbox">
                    <label for="{{field.name}}">{{field.label}}</label>
                </div>
                <div ng-switch-when="select">

                    <select class="form-control focusMe" id="gather-{{field.name}}"
                            name="{{field.name}}"
                            ng-model="field.value" ng-options="option as option.label for option in field.options track by option.id">
                    </select>

                </div>
                <div ng-switch-when="select2">

                    <select class="form-control focusMe" id="gather-{{field.name}}" name="{{field.name}}"
                            ng-model="field.value" placeholder="{{field.label}}">
                    </select>

                </div>
                <div ng-switch-when="fromdatepicker">
                    <div ng-model="pickDateService.from_date" pickadate></div>
                </div>
                <div ng-switch-when="todatepicker">
                    <div ng-model="pickDateService.to_date" pickadate></div>
                </div>
            </div>

        </div>

        <md-button class="gatherSubmit md-primary md-raised" ng-click="gather.submit()">{{gather.form.submitValue}}
        </md-button>
        <md-button class="md-warn md-raised" ng-click="gather.cancel()">Cancel</md-button>
    </div>


</div>
