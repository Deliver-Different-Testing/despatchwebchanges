<div class="gatherForm gatherFormMulti" id="{{gather.form.id}}" ng-if="gather.form.tpl == 'multi'">

    <div class="gather-box">
        <div class="gather-title">{{gather.form.title}}</div>
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-{{field.colSize}}" ng-repeat="field in gather.form.fields">
                    <div class="form-group">
                        <div ng-switch="field.type">
                            <div ng-switch-default>
                                <label for="jobNum">{{field.label}}:</label>
                                <input class="form-control focusMe" id="gather-{{field.name}}" name="{{field.name}}"
                                       ng-model="field.value" placeholder="{{field.label}}" type="text"/>
                            </div>
                            <div ng-switch-when="textarea">
                                <label for="jobNum">{{field.label}}:</label>
                                <textarea class="form-control focusMe" id="gather-{{field.name}}" name="{{field.name}}"
                                          ng-model="field.value" placeholder="{{field.label}}"></textarea>
                            </div>
                            <div ng-switch-when="time">
                                <label for="jobNum">{{field.label}}:</label>
                                <input class="form-control focusMe" id="gather-{{field.name}}" name="{{field.name}}"
                                       ng-model="field.value" placeholder="{{field.label}}" type="time"/>
                            </div>
                            <div ng-switch-when="checkbox" style="background-color:lightgray">
                                <input class="form-control" id="gather-{{field.name}}" name="{{field.name}}"
                                       ng-model="field.value" style="width:20px;height:20px;background-color:lightgray;font-size:21px;display:inline-block;"
                                       type="checkbox">
                                <label for="{{field.name}}">{{field.label}}</label>
                            </div>
                            <div ng-switch-when="date">
                                <label for="jobNum">{{field.label}}:</label>
                                <input class="form-control focusMe" id="gather-{{field.name}}" name="{{field.name}}"
                                       ng-model="field.value" placeholder="{{field.label}}" type="date"/>
                            </div>
                            <div ng-switch-when="select">

                                <select class="form-control focusMe" id="gather-{{field.name}}"
                                        name="{{field.name}}"
                                        ng-model="field.value" ng-options="option as option.label for option in field.options track by option.id">
                                </select>

                            </div>
                            <div ng-switch-when="hidden">
                                <label>{{field.label}}:</label>
                                <hidden id="gather-{{field.name}}" name="{{field.name}}" ng-model="field.value"/>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-12">

                    <button class="btn btn-primary" ng-click="gather.submit()">{{gather.form.submitValue}}</button>
                    <button class="btn btn-cancel" ng-click="gather.cancel()">Cancel</button>

                </div>
            </div>
        </div>
    </div>
</div>
