<div class="eventForm">

    <div class="event-box">
        <div class="event-title">ADD EVENT</div>
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-6">

                    <div class="form-group">
                        <label for="jobNum">Job Number:</label>
                        <input class="form-control" ng-model="eventForm.data.jobNum" readonly type="text">
                    </div>


                    <div class="form-group">
                        <label for="date">Event Date:</label>
                        <input class="form-control" ng-model="eventForm.data.date" readonly type="date">
                    </div>

                    <div class="form-group">
                        <label for="time">Event Time:</label>
                        <input class="form-control" ng-model="eventForm.data.time" readonly type="time">
                    </div>


                </div>
                <div class="col-md-6">

                    <div class="form-group">
                        <label for="client">Client:</label>
                        <input class="form-control" ng-model="eventForm.data.client" readonly type="text">
                    </div>

                    <div class="form-group">
                        <label for="event">Event:</label>
                        <select class="form-control focusMe" id="event-type" name="event-type"
                                ng-model="eventForm.data.event" placeholder="choose event type">
                        </select>
                    </div>


                </div>
                <div class="col-md-12">

                    <div class="form-group">
                        <label for="type">Notes:</label>
                        <textarea class="form-control" id="type" ng-model="eventForm.data.notes"></textarea>
                    </div>


                    <button class="btn btn-primary" ng-click="eventForm.submit()">Add Event</button>
                    <button class="btn btn-default" ng-click="eventForm.cancel()">Cancel</button>

                </div>
            </div>
        </div>
    </div>
</div>
