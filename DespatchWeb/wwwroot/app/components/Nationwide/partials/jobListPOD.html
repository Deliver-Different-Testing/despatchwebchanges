<md-table-container>
    <table md-progress="promise" md-row-select md-table ng-model="selected">
        <thead md-head md-order="sort.jobList">
        <tr md-row>
            <th md-column md-order-by="time">Time</th>
            <th md-column md-order-by="speed">Speed</th>
            <th md-column md-order-by="jobno">Job No</th>
            <th md-column md-order-by="client">Client</th>
            <th md-column md-order-by="from">From</th>
            <th md-column md-order-by="to">To</th>
            <th md-column md-order-by="courier">Courier</th>
            <th md-column md-order-by="pod">POD</th>
            <th md-column md-order-by="remain">Remain</th>
            <th md-column md-order-by="status">S</th>
            <th md-column></th>
            <th md-column style="width:20px;">E</th>
            <th md-column style="width:20px;">R</th>
        </tr>
        </thead>
        <tbody md-body>
        <tr class="clickable-row draggable-row noselect status" data-allow-dispatch="{{job.allowDispatch}}" data-courier="{{job.courier}}" data-index="{{$index}}"
            data-jobid="{{job.id}}" data-jobno="{{job.jobNo}}"
            md-row md-select="job" md-select-id="id"
            ng-class="getStatusClass(job)" ng-mouseup="selectJob(job)" ng-repeat="job in jobListPOD | filter: box.searchBox">
            <td md-cell>{{job.time | date: "HH:mm"}}</td>
            <td md-cell ng-click="speedColumnClick($event)" right-click>{{job.speed}}</td>
            <td context-menu="setEventsMenu" md-cell>{{job.jobNo}}</td>
            <td md-cell ng-click="clientColumnClick($event)" right-click>{{job.client}}</td>
            <td md-cell ng-click="fromColumnClick($event)" right-click
                style="width:50px; white-space:nowrap; overflow-x:hidden;">{{job.from}}
            </td>
            <td md-cell ng-click="toColumnClick($event)" right-click>{{job.to}}</td>
            <td md-cell>
                <input class="dispatchField" ng-keydown="$event.keyCode === 13 && dispatchJobsFromPOD(job.courier)"
                       ng-model="job.courier"
                       ng-readonly="job.courierData.courierID !== null"
                       ng-style="getJobStyle(job.courierData.courierID !== null)"
                       placeholder="" type="text"/>
            </td>
            <td md-cell>{{job.pod}}</td>
            <td md-cell><span ng-style='{"color":"darkorange", "font-weight": "bold"}'>{{job.remain}}</span></td>
            <td class="status" md-cell ng-class="job.status">{{job.status}}</td>
            <td class="selectjob" md-cell ng-click="selectForDispatch(job); $event.stopPropagation();"
                style="display:none" title="placeholder selector"></td>
            <td md-cell ng-click="createEvent();" style="width:20px;" title="Create Event">
                <md-icon class="material-symbols-outlined">calendar_add_on</md-icon>
            </td>
            <td md-cell ng-click="job.courier == null || restoreJobsFromPOD();" style="width:20px;" title="Restore">
                <md-icon class="material-symbols-outlined" ng-if="job.courier !== null">undo</md-icon>
            </td>
        </tr>
        </tbody>
    </table>
</md-table-container>

<div layout="row" layout-align="space-around" layout-sm="column" ng-show="isLoading">
    <md-progress-circular md-mode="indeterminate"></md-progress-circular>
    <span class="sr-only">Loading...</span>
</div>

<script>
    angular.element(".box-content").on("scroll", function () {
        var newTop = angular.element(this).scrollTop();
        angular.element(this).find(".table-headings").css({"top": newTop});
    });
</script>
