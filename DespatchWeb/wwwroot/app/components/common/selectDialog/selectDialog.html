<md-dialog aria-label="{{ ctrl.title }}" id="{{ ctrl.id }}">
    <md-dialog-content>
        <div class="md-dialog-content">
            <form ng-submit="ctrl.submit(ctrl.field.value)">
                <h2 class="md-title">Edit {{ ctrl.title }}</h2>

                <!-- Select field -->
                <md-select aria-label="Select an option" ng-model="ctrl.field.value"
                           placeholder="{{ ctrl.field.options.placeholder }}">
                    <md-option ng-repeat="item in ctrl.field.options.items" ng-value="item">
                        {{ item.text }}
                    </md-option>
                </md-select>
            </form>
        </div>
    </md-dialog-content>

    <md-dialog-actions>
        <md-button ng-click="ctrl.cancel()">
            Cancel
        </md-button>

        <md-button class="md-primary" ng-click="ctrl.submit(ctrl.field.value)">
            Save
        </md-button>
    </md-dialog-actions>
</md-dialog>
