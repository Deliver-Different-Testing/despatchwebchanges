<md-dialog aria-label="{{ ctrl.title }}" id="{{ ctrl.id }}">
    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>Edit {{ ctrl.title }}</h2>
        </div>
    </md-toolbar>

    <md-dialog-content>
        <div class="md-dialog-content">
            <form ng-submit="ctrl.submit(ctrl.selectedOption)">

                <!-- Select field -->
                <md-select aria-label="Select an option" ng-model="ctrl.selectedOption"
                           placeholder="{{ ctrl.options.placeholder }}">
                    <md-option ng-repeat="item in ctrl.options.items" ng-value="item">
                        {{ item.text }}
                    </md-option>
                </md-select>
            </form>
        </div>
    </md-dialog-content>

    <md-dialog-actions>
        <md-button class="md-primary" ng-click="ctrl.cancel()">
            Cancel
        </md-button>

        <md-button class="md-primary" ng-click="ctrl.submit(ctrl.selectedOption)" ng-disabled="!ctrl.selectedOption">
            Save
        </md-button>
    </md-dialog-actions>
</md-dialog>
