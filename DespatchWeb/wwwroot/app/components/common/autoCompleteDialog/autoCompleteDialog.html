<md-dialog aria-label="{{ ctrl.title }}" id="{{ ctrl.id }}">
    <md-dialog-content>
        <div class="md-dialog-content">
            <form ng-submit="ctrl.submit(ctrl.selectedItem)">
                <h2 class="md-title">Edit {{ ctrl.title }}</h2>

                <!-- Autocomplete field -->
                <md-autocomplete
                        md-autofocus
                        md-autoselect
                        md-escape-options="clear"
                        md-item-text="item.text"
                        md-items="item in ctrl.querySearch(ctrl.searchText)"
                        md-min-length="0"
                        md-search-text="ctrl.searchText"
                        md-selected-item="ctrl.selectedItem" placeholder="{{ctrl.options.placeholder }}">
                    <md-item-template>
                        <span md-highlight-flags="^i" md-highlight-text="ctrl.searchText">{{item.text}}</span>
                    </md-item-template>
                    <md-not-found>
                        No {{ ctrl.title }} matching "{{ctrl.searchText}}" were found.
                    </md-not-found>
                </md-autocomplete>

                <!-- Checkbox -->
                <div layout="row" layout-align="center center">
                    <md-input-container ng-show="ctrl.showRerateOption">
                        <md-checkbox ng-model="ctrl.shouldRerateJob">
                            Re-Rate?
                        </md-checkbox>
                    </md-input-container>
                </div>
            </form>
        </div>
    </md-dialog-content>

    <md-dialog-actions>
        <md-button class="md-primary" ng-click="ctrl.submit(ctrl.selectedItem)">
            <md-icon md-font-set="material-symbols-outlined">save</md-icon>
            Save
        </md-button>

        <md-button ng-click="ctrl.cancel()">
            Cancel
        </md-button>
    </md-dialog-actions>
</md-dialog>
