<div class="top-bar">
    <img src="/images/menu-urgent.png" class="logo" />

    <div id="status-group" class="btn-group" role="group">
        <button type="button" class="btn new btn-sm btn-secondary" ng-click="setFilters({'status':'new'})">New</button>
        <button type="button" class="btn nda btn-sm btn-secondary" ng-click="setFilters({'status':'nda'})">NDA</button>
        <button type="button" class="btn active btn-sm btn-secondary" ng-click="setFilters({'status':'active'})">Active</button>
        <button type="button" class="btn done btn-sm btn-secondary" ng-click="setFilters({'status':'done'})">Done</button>
        <button type="button" class="btn all btn-sm btn-secondary" ng-click="setFilters({'status':'all'})">All</button>
    </div>

    <div id="area-group" class="btn-group" role="group" aria-label="Basic example">
        <button type="button" class="btn city btn-sm btn-secondary" ng-click="setFilters({'area':'city'})">City</button>
        <button type="button" class="btn truck btn-sm btn-secondary" ng-click="setFilters({'area':'truck'})">Truck</button>
        <button type="button" class="btn main1 btn-sm btn-secondary" ng-click="setFilters({'area':'main1'})">Main1</button>
        <button type="button" class="btn main2 btn-sm btn-secondary" ng-click="setFilters({'area':'main2'})">Main2</button>
        <button type="button" class="btn central btn-sm btn-secondary" ng-click="setFilters({'area':'central'})">Central</button>
        <button type="button" class="btn shore btn-sm btn-secondary" ng-click="setFilters({'area':'shore'})">Shore</button>
        <button type="button" class="btn west btn-sm btn-secondary" ng-click="setFilters({'area':'west'})">West</button>
        <button type="button" class="btn remoteouter btn-sm btn-secondary" ng-click="setFilters({'area':'remote outer'})">Remote Outer</button>
        <button type="button" class="btn remotecity btn-sm btn-secondary" ng-click="setFilters({'area':'remote city'})">Remote City</button>
        <button type="button" class="btn remotecentral btn-sm btn-secondary" ng-click="setFilters({'area':'remote central'})">Remote Central</button>
        <button type="button" class="btn all btn-sm btn-secondary" ng-click="setFilters({'area':'all'})">All</button>
    </div>
    
    <div class="btn-group box-search">
        <!--<i class="fa fa-search" ng-click="searchCourier()" title="GPS Courier"></i> 
        <input type="text" style="color: black;" placeholder="gps courier (enter code)..." ng-model="courier.gpsCourier" id="gps"/>
        <i class="fa fa-remove" ng-click="courier.gpsCourier = ''" title="Clear"></i>-->
        <!--<div class="multi-element btn" ng-dropdown-multiselect="" options="pickCouriers" extra-settings="{enableSearch:true, selectionLimit:1, closeOnBlur: true, closeOnSelect: true}" selected-model="gpsCourier"></div>-->
    </div>

    <div class="topbar-buttons">
        <div class="btn topbar-button" style="color:white;"><span>hi {{userName}} - layout: {{currentLayoutName}}</span></div>
        <div class="btn btn-sm btn-primary topbar-button" ng-click="getData()"><i class="fa fa-refresh"></i></div>
        <div class="dropdown topbar-button">
            <button class="btn btn-sm btn-primary dropdown-toggle" type="button" id="dropdownMenu1" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true">
                Layout
                <span class="caret"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenu1">
                <li><a class="dropdown-item" href="#" ng-click="saveLayout()"><b>Save Layout</b></a></li>
                <li><a class="dropdown-item" href="#" ng-click="loadLayout($index)"  ng-repeat="lo in layouts track by $index">{{lo.name}}</a></li>
            </ul>
        </div>
    </div>
</div>

<div class="">

    <div class="columns">

        <div class="column" ng-repeat="(colKey,column) in layout.columns" id="co-{{column.id}}" resizablelayout r-directions="['right']" r-flex="true" style="flex-basis: {{column.width}}">
            <div class="column-sortable" ng-model="column.boxes" ui-sortable="sortableOptions">
                <div class="box" ng-repeat="(boxName,box) in column.boxes" id="box-{{box.name}}" resizablelayout r-directions="['bottom']" r-flex="true" style="flex-basis: {{box.height}}">
                    <div class="box-bar">
                        <div class="box-bar-title">
                            {{boxes[box.name].title}}
                            <span ng-show="box.name == 'jobDetail'">{{currentSelection}}</span>
                            <span ng-show="box.name == 'jobGroups'">{{groupJobsSelection}}</span>
                            <span ng-show="box.name == 'potentialCouriers'">{{potentialCouriersSelection}}</span>
                            <span ng-show="box.name == 'currentWork' || box.name == 'map'">{{currentWorkSelection}}</span>
                        </div>
                        <div class="box-buttons">
                            <div class="box-details" ng-show="boxes[box.name].showDetailButtons" ng-if="currentJob">

                                <div class="btn-group" role="group" aria-label="Basic example">
                                    <button type="button" class="btn btn-sm btn-secondary" title="ADD EVENT" ng-click="addEvent(currentJob)"><i class="fa fa-calendar-plus-o"></i></button>
                                    <button type="button" class="btn btn-sm btn-secondary" title="SEND POD"><i class="fa fa-send"></i></button>
                                    <button type="button" class="btn btn-sm btn-secondary" title="TEXT POD"><i class="fa fa-file-text"></i></button>
                                    <button type="button" class="btn btn-sm btn-secondary" title="EMAIL POD"><i class="fa fa-envelope"></i></button>
                                    <button type="button" class="btn btn-sm btn-secondary" title="Clear POD"><i class="fa fa-retweet"></i></button>
                                </div>

                            </div>
                            <div class="btn-group " style="padding:8px 5px;" ng-show="box.name === 'jobsList'">
                                <i class="fa fa-search" ng-click="searchCourier()" title="GPS Courier"></i>
                                <input type="text" style="color: black;display:inline-block!important;" placeholder="gps courier (enter code)..." ng-model="$parent.$parent.courier.gpsCourier" id="gps" />
                                <i class="fa fa-remove" ng-click="courier.gpsCourier = ''" title="Clear"></i>
                            </div>
                            <div class="btn btn-sm btn-primary box-refresh" ng-show="boxes[box.name].showRefresh" ng-click="getData()"><i class="fa fa-refresh"></i></div>
                            <div class="btn btn-sm box-refresh" ng-show="box.name === 'clearLists'" ng-click="areaListCity = !areaListCity">City <i ng-class="areaListCity ? 'fa fa-toggle-on' : 'fa fa-toggle-off'"></i></div>
                            <div class="btn btn-sm box-refresh" ng-show="box.name === 'map'" ng-click="allCouriers.display = !allCouriers.display;getAvailableCourierLocation();">All <i ng-class="allCouriers.display ? 'fa fa-toggle-on' : 'fa fa-toggle-off'"></i></div>

                            <div class="box-search" ng-show="boxes[box.name].showSearch">
                                <i class="fa fa-search" ng-click="openSearch(box.name)"></i>
                                <i class="fa fa-remove" ng-click="box.searchBox = ''" title="Clear"></i>
                                <input type="text" ng-model="box.searchBox" placeholder="Search..." ng-model-options="{debounce: 300}">

                            </div>

                            <div class="box-handle"><i class="fa fa-ellipsis-v"></i> </div>
                        </div>
                    </div>
                    <div class="box-content" ng-include="boxes[box.name].tpl"></div>
                </div>

            </div>
        </div>

    </div>

</div>

<script>



    document.onkeydown = overrideKeyboardEvent;
    document.onkeyup = overrideKeyboardEvent;
    var keyIsDown = {};

    function overrideKeyboardEvent(e) {
        switch (e.type) {
            case "keydown":
                if (!keyIsDown[e.keyCode]) {
                    keyIsDown[e.keyCode] = true;
                    // do key down stuff here
                    if (e.keyCode == 82 && e.ctrlKey) {
                        //location.reload();
                    }
                }
                break;
            case "keyup":
                delete (keyIsDown[e.keyCode]);
                // do key up stuff here
                break;
        }
        disabledEventPropagation(e);
        if (e.keyCode == 68 && e.ctrlKey) {
            e.preventDefault();
            return false;
        }
    }
    function disabledEventPropagation(e) {
        if (e.keyCode == 68 && e.ctrlKey) {
            if (e.stopPropagation) {
                e.stopPropagation();
            } else if (window.event) {
                window.event.cancelBubble = true;
            }
        }
    }



    $(document).on('keydown', '.dispatchField, .lateCallField', function (event) {
        if (event.keyCode == 13) {
            $(this).parents(".clickable-row").addClass("doing");
        }
    });

    $(document).on('click', '.top-bar .btn-group .btn', function (event) {
        if (!event.ctrlKey) {
            $(this).parent().find('.topBarActive').removeClass('topBarActive');
        }
        
        $(this).addClass('topBarActive');
    });


    $(document).ready(function () {

        var isDown = false;   // Tracks status of mouse button

        $(document).mousedown(function () {
            isDown = true;      // When mouse goes down, set isDown to true
        })
            .mouseup(function () {
                isDown = false;    // When mouse goes up, set isDown to false
            });

        $(document).on("mouseenter", ".activeTable .clickable-row", function (event) {

            if (event.ctrlKey) {
                if (isDown) {        // Only change css if mouse is down
                    $(this).addClass("active");
                    $(this).siblings(".test").click();
                }
            }
        });


    });



    var mouseDown = 0;

    $(document).on('mousedown', '.clickable-row', function (event) {

        if ($(".activeTable .clickable-row.active").length > 1) {
            var jobNo = $(".activeTable .clickable-row.active").length + " Jobs";
        } else {
            var jobNo = $(this).attr("data-jobno");
        }


        if (mouseDown == 0) {
            mouseDown = 1;

            if (event.which === 1) {
                if (event.ctrlKey) {
                    if ($(this).hasClass("active")) {
                        $(this).removeClass('active');
                    } else {
                        $(this).addClass('active');
                    }
                } else {
                    if (!$(this).hasClass("active")) {

                        var group = $(this).parents(".table-rows").attr("data-group");
                        $('*[data-group="' + group + '"]').each(function () {
                            $(this).find('.active').removeClass('active');
                        });

                        $(this).addClass('active');
                    }
                }

                $(".activeTable").removeClass("activeTable");
                $(this).parents(".table").addClass("activeTable");
            }

            if (!event.ctrlKey) {
                if ($(this).hasClass("draggable-row")) {

                    if (!$(this).hasClass("active")) {

                        var group = $(this).parents(".table-rows").attr("data-group");
                        $('*[data-group="' + group + '"]').each(function () {
                            $(this).find('.active').removeClass('active');
                        });
                        $(this).addClass('active');

                    }
                    setTimeout(function () {
                        if (mouseDown == 1) {
                            $("#draggingItems").show();
                            $("#draggingItems").html(jobNo);

                            $("#draggingItems").css({ "top": event.pageY - 25, "left": event.pageX - 50 });
                            $("#draggingItems").draggable();
                            $("#draggingItems").trigger(event);
                        }
                    }, 200);
                }
            }

        }

    });

    $(document).on('mouseup', '.clickable-row', function (event) {
        if (event.which === 3) {

            $(".rightActiveTable").removeClass("rightActiveTable");
            $(this).parents(".table").addClass("rightActiveTable");
        }
        if (!event.ctrlKey) {

            if ($(this).hasClass("active")) {
            } else {
                var group = $(this).parents(".table-rows").attr("data-group");

                $('*[data-group="' + group + '"]').each(function () {
                    $(this).find('.active').removeClass('active');
                });
                $(this).addClass('active');
            }

        }

    });






    $(document).on("mouseup", function (ev) {
        $("#draggingItems").hide();
        mouseDown = 0;
    });

    $(document).on("keydown", function (e) {
        var code = (e.keyCode ? e.keyCode : e.which);
        if (code == 40) {
            $(".activeTable").find(".active").removeClass("active").next().addClass("active").mouseup().click();
        } else if (code == 38) {
            $(".activeTable").find(".active").removeClass("active").prev().addClass("active").mouseup().click();
        }
    });


    //var delay = 250; // delay between calls
    //var throttled = false; // are we currently throttled?

    //setTimeout(function(){ sizeHeadings($("#jobList").parents(".column")); }, 100);

    function sizeHeadings(ele) {

        $("body").find(".box").each(function () {
            var box = $(this);
            box.find(".table-headings thead tr th").each(function (index) {
                var newWidth = box.find(".table tbody tr td").eq(index).width();
                $(this).width(newWidth);
            });
            box.find(".table-headings table").width(box.find(".table").width());
        });

        var height = $("#box-clearLists").find(".box-content").height() - 30;

        $(".clearLists-list").each(function () {
            var newHeight = $(this).data("height") * height / 100;
            $(this).height(newHeight);
        });

    }



</script>
