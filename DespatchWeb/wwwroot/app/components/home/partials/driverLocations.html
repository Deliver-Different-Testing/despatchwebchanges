<!-- Loading Indicator -->
<div class="loader-container" ng-if="driverLocationsLoading">
    <div class="full-height" layout="row" layout-align="center center">
        <div class="material-icon-loader">
            <md-progress-circular md-diameter="60" md-mode="indeterminate"></md-progress-circular>
            <md-icon class="loader-icon" md-font-set="material-symbols-outlined">person_pin_circle</md-icon>
        </div>
    </div>
</div>

<div id="driverLocations" ng-if="!driverLocationsLoading && driverLocations && driverLocations.areas.length > 0">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-3" ng-repeat="area in driverLocations.areas">
                <div class="driverLocations-list" ng-style="{ 'height': area.percentHeight + '%' }">
                    <div class="driverLocations-list-title"
                         ng-class="{'listActive': area.isActive}"
                         ng-click="selectClearList(area); setActiveArea(area);">
                        {{area.name}} {{area.totalRemaining}}
                    </div>
                    <div class="driverLocations-list-items">
                        <table>
                            <tr class="driverLocations-list-items-item driverLocations-list-items-top droppable-row draggable-row"
                                ng-class="{'active': courier.isActive}"
                                data-courier="{{courier.courierNumber}}"
                                ng-click="selectCourier(courier.courierData)"
                                ng-if="((courier.courierNumber.indexOf('T') >= 0 && (truckMode=='On' || truckMode=='Only')) || (courier.courierNumber.indexOf('T') < 0 && truckMode !== 'Only'))"
                                ng-repeat="courier in area.top">
                                <td class="driverLocations-list-items-item-number"
                                    ng-class="{'active': courier.isActive}">{{courier.courierNumber}}
                                </td>
                                <td>
                                    <div class="driverLocations-list-items-item-dest"
                                         ng-repeat="destination in courier.destinations">{{destination.label}}
                                    </div>
                                </td>
                            </tr>
                            <tr class="driverLocations-list-items-item driverLocations-list-items-middle droppable-row draggable-row"
                                ng-class="{'active': courier.isActive}"
                                data-courier="{{courier.courierNumber}}"
                                ng-click="selectCourier(courier.courierData)"
                                ng-if="((courier.courierNumber.indexOf('T') >= 0 && (truckMode=='On' || truckMode=='Only')) || (courier.courierNumber.indexOf('T') < 0 && truckMode !== 'Only'))"
                                ng-repeat="courier in area.middle">
                                <td class="driverLocations-list-items-item-number"
                                    ng-class="{'active': courier.isActive}">{{courier.courierNumber}}
                                </td>
                                <td>
                                    <div class="driverLocations-list-items-item-dest"
                                         ng-repeat="destination in courier.destinations">{{destination.label}}
                                    </div>
                                </td>
                            </tr>
                            <tr class="driverLocations-list-items-item driverLocations-list-items-bottom droppable-row draggable-row"
                                ng-class="{'active': courier.isActive}"
                                data-courier="{{courier.courierNumber}}"
                                ng-click="selectCourier(courier.courierData)"
                                ng-if="((courier.courierNumber.indexOf('T') >= 0 && (truckMode=='On' || truckMode=='Only')) || (courier.courierNumber.indexOf('T') < 0 && truckMode !== 'Only'))"
                                ng-repeat="courier in area.bottom">
                                <td class="driverLocations-list-items-item-number"
                                    ng-class="{'active': courier.isActive}">{{courier.courierNumber}}
                                </td>
                                <td>
                                    <div class="driverLocations-list-items-item-dest"
                                         ng-repeat="destination in courier.destinations">{{destination.label}}
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="no-data" ng-if="!driverLocations || driverLocations.areas.length === 0">
    <div class="content">
        <div class="icon">
            <md-icon md-font-set="material-symbols-outlined">person_pin_circle</md-icon>
        </div>
        <div class="text">
            Please configure driver locations in Admin Manager to continue.
        </div>
    </div>
</div>
