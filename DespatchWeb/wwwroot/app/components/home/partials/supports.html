<!-- Supports List Component -->
<div class="job-list-container" ng-if="!supportsLoading && supports.length > 0">
    <!-- Table Headers -->
    <div class="table-headings sticky-header">
        <table>
            <thead class="thead-dark no select">
            <tr>
                <th ng-click="orderList('supports', header.key)" ng-repeat="header in supportListHeaders">
                    <i class="material-symbols-outlined job-table-icon"
                       ng-if="sort.jobList == header.key">arrow_drop_down</i>
                    <i class="material-symbols-outlined job-table-icon"
                       ng-if="sort.jobList == 'd-' + header.key">arrow_drop_up</i>
                    {{header.label}}
                </th>
            </tr>
            </thead>
        </table>
    </div>

    <table class="table table-striped table-rows table-responsive" data-group="supports" id="supports">
        <tbody>
        <tr class="clickable-row"
            context-menu="supportMenu"
            data-id="{{support.eventId}}"
            ng-class="getSupportColorClass(support)"
            ng-click="selectSupportJobDetail(support)"
            ng-repeat="support in supports | filter: box.searchBox">
            <td>{{support.timeStamp | date: "HH:mm"}}</td>
            <td width="30">{{support.courier}}</td>
            <td width="60">{{support.staff}}</td>
            <td>{{support.jobNumber}}</td>
            <td>{{support.description}}</td>
            <td>{{support.notes}}</td>
            <td>{{support.remainTime}}</td>
            <td ng-click="lockSupport(support)" style="cursor:pointer;" width="60">{{support.lockedBy}}</td>
        </tr>
        </tbody>
    </table>
</div>


<div class="no-data" ng-if="!supportsLoading && (!supports || supports === 0)">
    <div class="content">
        <div class="icon">
            <md-icon md-font-set="material-symbols-outlined">support</md-icon>
        </div>
        <div class="text">
            No Supports Available
        </div>
    </div>
</div>

<!-- Loading Indicator -->
<div class="loading" ng-if="supportsLoading">
    <div class="text">
        <md-progress-circular md-diameter="60" md-mode="indeterminate"></md-progress-circular>
        <md-icon class="loader-icon" md-font-set="material-symbols-outlined">help</md-icon>
        <span class="sr-only">Loading...</span>
    </div>
</div>
