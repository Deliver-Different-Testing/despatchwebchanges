<!-- Bulk Job List Container -->
<div class="droppable-box" style="min-height:500px">
    <md-table-container>
        <table md-progress="bulkJobPromise" md-table>
            <thead md-head md-on-reorder="orderList('bulkJobList', bulkJobQuery.order)" md-order="bulkJobQuery.order">
            <tr md-row>
                <th md-column md-order-by="booked">
                    <span>Booked</span>
                </th>
                <th md-column md-order-by="status">
                    <span>Status</span>
                </th>
                <th md-column md-order-by="speed">
                    <span>Speed</span>
                </th>
                <th md-column md-order-by="jobNo">
                    <span>Job</span>
                </th>
                <th md-column md-order-by="client">
                    <span>Client</span>
                </th>
                <th md-column md-order-by="from">
                    <span>From</span>
                </th>
                <th md-column md-order-by="to">
                    <span>To</span>
                </th>
            </tr>
            </thead>

            <tbody md-body>
            <tr class="droppable-row draggable-row"
                data-courier="{{job.courier}}"
                data-jobNo="{{job.jobNo}}"
                data-jobid="{{job.id}}"
                md-row
                ng-click="selectBulkJobDetail(job.id)"
                ng-repeat="job in bulkJobList | filter: box.searchBox | orderBy: bulkJobQuery.order">

                <td md-cell>{{job.booked | date: "dd/MM/yy HH:mm"}}</td>
                <td class="status" md-cell ng-class="job.status">{{job.status}}</td>
                <td md-cell ng-click="speedColumnClick($event); $event.stopPropagation()">{{job.speed}}</td>
                <td md-cell>{{job.jobNo}}</td>
                <td md-cell ng-click="clientColumnClick($event); $event.stopPropagation()">{{job.client}}</td>
                <td md-cell ng-click="fromColumnClick($event); $event.stopPropagation()">
                    {{isUsCustomer ? job.pickupAddress.addressLine5 : job.from}}
                    <md-icon md-font-set="material-symbols-outlined" ng-if="!job.pickUpLongitude">warning</md-icon>
                </td>
                <td md-cell ng-click="toColumnClick($event); $event.stopPropagation()">
                    {{job.to}}
                    <md-icon md-font-set="material-symbols-outlined" ng-if="!job.deliveryLongitude">warning</md-icon>
                </td>
            </tr>
            </tbody>
        </table>
    </md-table-container>

    <md-table-pagination
            md-limit="bulkJobQuery.limit"
            md-limit-options="[5, 10, 25, 50]"
            md-on-paginate="bulkJobPageChanged"
            md-page="bulkJobQuery.page"
            md-page-select
            md-total="{{bulkJobTotalCount}}">
    </md-table-pagination>
</div>

<!-- Loading Indicator -->
<div class="loading" ng-if="bulkJobPromise">
    <div class="text">
        <md-progress-circular md-diameter="60" md-mode="indeterminate"></md-progress-circular>
        <span class="sr-only">Loading...</span>
    </div>
</div>

<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
    }

    /* Preserve status styling */
    .status {
        font-weight: 500;
    }

    .md-table-container {
        overflow: auto;
    }

    /* Ensure proper cursor for clickable elements */
    [ng-click] {
        cursor: pointer;
    }
</style>
