<!-- Pre-Book List Container -->
<div class="droppable-box" style="min-height:500px">
    <md-table-container>
        <table md-progress="preBookPromise" md-table>
            <thead md-head md-on-reorder="orderList('pbList', preBookQuery.order)" md-order="preBookQuery.order">
            <tr md-row>
                <th md-column md-order-by="booked">
                    <span>Booked</span>
                </th>
                <th md-column md-order-by="speed">
                    <span>Speed</span>
                </th>
                <th md-column md-order-by="jobNo">
                    <span>Job</span>
                </th>
                <th md-column md-order-by="client">
                    <span>Client</span>
                </th>
                <th md-column md-order-by="from">
                    <span>From</span>
                </th>
                <th md-column md-order-by="to">
                    <span>To</span>
                </th>
                <th md-column md-order-by="code">
                    <span>Code</span>
                </th>
                <th md-column>
                    <span>S</span>
                </th>
                <th md-column>
                    <span>V</span>
                </th>
            </tr>
            </thead>

            <tbody md-body>
            <tr class="droppable-row draggable-row"
                data-courier="{{job.courier}}"
                data-jobNo="{{job.jobNo}}"
                data-jobid="{{job.id}}"
                md-row
                ng-mouseup="selectPreBookDetail(job.id)"
                ng-repeat="job in pbList | filter: box.searchBox | orderBy: preBookQuery.order | limitTo: preBookQuery.limit : (preBookQuery.page - 1) * preBookQuery.limit">

                <td md-cell>{{job.booked | date: "HH:mm"}}</td>
                <td md-cell>{{job.speed}}</td>
                <td md-cell>{{job.jobNo}}</td>
                <td md-cell ng-click="clientColumnClick($event); $event.stopPropagation()">{{job.client}}</td>
                <td context-menu="setCurrentWorkMenu" md-cell>
                    <div title="{{job.fromAddress}}">{{job.fromAddress}}</div>
                </td>
                <td context-menu="setCurrentWorkMenu" md-cell>
                    <div title="{{job.toAddress}}">{{job.toAddress}}</div>
                </td>
                <td md-cell>{{job.courier}}</td>
                <td md-cell>
                    <md-button class="md-icon-button" ng-click="sendPrebookJob(job.id); $event.stopPropagation()"
                               title="Send">
                        <md-icon md-font-set="material-symbols-outlined">send</md-icon>
                    </md-button>
                </td>
                <td md-cell>
                    <md-button class="md-icon-button" ng-click="voidPrebookJob(job.id); $event.stopPropagation()"
                               title="Void">
                        <md-icon md-font-set="material-symbols-outlined">delete</md-icon>
                    </md-button>
                </td>
            </tr>
            </tbody>
        </table>
    </md-table-container>

    <md-table-pagination
            md-limit="preBookQuery.limit"
            md-limit-options="[5, 10, 25, 50]"
            md-on-paginate="preBookPageChanged"
            md-page="preBookQuery.page"
            md-page-select
            md-total="{{pbTotalCount}}">
    </md-table-pagination>
</div>

<!-- Loading Indicator -->
<div class="loading" ng-if="preBookPromise">
    <div class="text">
        <md-progress-circular md-diameter="60" md-mode="indeterminate"></md-progress-circular>
        <span class="sr-only">Loading...</span>
    </div>
</div>

<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
    }

    /* Preserve table functionality */
    .md-table-container {
        overflow: auto;
    }

    /* Make action buttons more compact */
    .md-icon-button {
        margin: 0;
        padding: 4px;
        min-height: 0;
        line-height: normal;
    }
</style>
