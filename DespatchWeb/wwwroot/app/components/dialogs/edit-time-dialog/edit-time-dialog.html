<md-dialog aria-label="{{ ctrl.title }}" id="{{ ctrl.id }}">
    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>Edit {{ ctrl.title }}</h2>
        </div>
    </md-toolbar>

    <md-dialog-content>
        <div class="md-dialog-content">

            <md-time-picker message="ctrl.message" ng-model="ctrl.time"></md-time-picker>

        </div>
    </md-dialog-content>

    <md-dialog-actions>
        <md-progress-circular
                class="md-primary"
                md-diameter="40"
                md-mode="indeterminate"
                ng-disabled="!ctrl.time"
                ng-show="ctrl.isLoading">
        </md-progress-circular>

        <md-button class="md-primary" ng-click="ctrl.cancel()" ng-show="!ctrl.isLoading">
            Cancel
        </md-button>

        <md-button class="md-primary" ng-click="ctrl.submit(ctrl.time)" ng-disabled="!ctrl.time"
                   ng-show="!ctrl.isLoading">
            Save
        </md-button>
    </md-dialog-actions>
</md-dialog>
