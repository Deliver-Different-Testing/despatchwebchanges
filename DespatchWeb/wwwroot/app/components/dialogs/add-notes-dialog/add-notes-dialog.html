<md-dialog aria-label="{{ ctrl.title }}" id="{{ ctrl.id }}">
    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>Add {{ ctrl.title }}</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="ctrl.cancel()">
                <md-tooltip md-direction="bottom">Cancel</md-tooltip>
                <md-icon aria-label="Close dialog" md-font-set="material-symbols-outlined">
                    close
                </md-icon>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content>
        <div class="md-dialog-content">
            <form ng-submit="ctrl.submit(ctrl.note)">

                <!-- Text Area -->
                <md-input-container class="md-block" flex-gt-sm>
                    <label for="notes">{{ ctrl.title }}</label>
                    <textarea id="notes" md-maxlength="150" md-min-length="1" md-select-on-focus ng-model="ctrl.note"
                              rows="5"></textarea>
                </md-input-container>

            </form>
        </div>
    </md-dialog-content>

    <md-dialog-actions>
        <md-progress-circular
                class="md-primary"
                md-diameter="40"
                md-mode="indeterminate"
                ng-disabled="!ctrl.note"
                ng-show="ctrl.isLoading">
        </md-progress-circular>

        <md-button
                class="md-raised md-primary"
                ng-click="ctrl.submit(ctrl.note)"
                ng-disabled="!ctrl.note"
                ng-show="!ctrl.isLoading">
            Save
        </md-button>
    </md-dialog-actions>
</md-dialog>
