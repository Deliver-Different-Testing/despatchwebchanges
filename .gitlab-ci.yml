include:
  - project: 'urgent-couriers/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

# NuGet credentials for parent pipeline jobs (test:backend)
# NOTE: The child pipeline (Auto-DevOps Docker build) gets these via
# project-level CI/CD variables set in GitLab > Settings > CI/CD > Variables
variables:
  GITLAB_NUGET_USERNAME: "gitlab-ci-token"
  GITLAB_NUGET_TOKEN: "${CI_JOB_TOKEN}"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  # Opts this project into the per-deploy release notes emitted by ci-templates'
  # generate-pipeline.sh. Setup and CI variables: docs/release-notes-setup.md
  RELEASE_NOTES_ENABLED: "true"

# Only run deploy on protected branches, not on MR pipelines
deploy-dynamic-pipeline:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

# Workflow rules - prioritize merge request pipelines to block merges on failure
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Run pipeline for merge requests (blocks merge if tests fail)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run pipeline for protected branches after merge
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run pipeline for tags (releases)
    - if: $CI_COMMIT_TAG

# Path-based rules: only run backend tests when backend files change
.backend-test-rules:
  interruptible: true
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      changes:
        paths:
          - "**/*.cs"
          - "**/*.csproj"
          - Directory.Build.props
          - Directory.Packages.props
          - nuget.config
          - global.json
          - .gitlab-ci.yml
        compare_to: refs/heads/master

# Path-based rules: only run frontend tests when frontend files change
.frontend-test-rules:
  interruptible: true
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      changes:
        paths:
          - "wwwroot/**/*"
          - "scripts/**/*"
          - package.json
          - package-lock.json
          - jest.config.js
          - jest.integration.config.js
          - tsconfig.json
          - tsconfig.test.json
          - eslint.config.mjs
          - .gitlab-ci.yml
        compare_to: refs/heads/master

# Test jobs - only run on merge requests targeting protected branches
test:backend:
  stage: .pre
  image: mcr.microsoft.com/dotnet/sdk:10.0
  # Retry on any non-test failure reason (a dead/evicted K8s pod can be tagged with
  # several of these). Genuine test failures are `script_failure`, deliberately kept OUT
  # of the list so failing tests still fail fast and block the merge.
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
      - data_integrity_failure
  allow_failure: false
  variables:
    # Force workstation GC: Server GC reserves per-core heaps sized off the node's core
    # count (not the pod cgroup), a classic K8s OOM driver for this in-process test run.
    DOTNET_gcServer: "0"
    DOTNET_GCConserveMemory: "9"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    # Guaranteed pod headroom so it isn't OOMKilled/evicted. Only applied if the runner
    # allows overwrites (otherwise silently ignored, never a hard failure).
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "6Gi"
    # Disk is the other eviction axis: kubelet ranks pods by usage ABOVE their request,
    # so a request of 0 made this pod (2.5Gi of extracted NuGet cache) the node's first
    # victim whenever the cluster crossed its ephemeral-storage threshold. Same "only if
    # the runner allows overwrites" caveat as the CPU/memory pair above.
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "6Gi"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "12Gi"
    # Pull-only by default. `pull-push` re-tarred 17,968 files (~2.5Gi) to the pod's
    # ephemeral disk on every single MR run for a cache that almost never changes, which
    # is what tipped the node over. A cold or stale cache is harmless — `dotnet restore`
    # just fetches the delta from the network. To refresh the cache, run a pipeline with
    # BACKEND_CACHE_POLICY=pull-push (pipeline variables outrank job variables).
    # Note it must be refreshed from an MR/non-protected ref: the runner namespaces the
    # cache as `-non_protected` vs `-protected`, so a master run writes a different key.
    BACKEND_CACHE_POLICY: "pull"
  cache:
    key: dotnet-packages
    paths:
      - .nuget/packages/
    policy: $BACKEND_CACHE_POLICY
  script:
    - dotnet restore
    - dotnet run --project DespatchWeb.Tests --no-restore
  extends: .backend-test-rules

# Frontend base configuration
.frontend-base:
  image: node:20-alpine
  interruptible: true
  retry:
    max: 2
    when: runner_system_failure
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - node_modules/
        - .npm/
      policy: pull-push
    - key: jest-cache-${CI_COMMIT_REF_SLUG}
      paths:
        - .jest-cache/
      policy: pull-push
      fallback_keys:
        - jest-cache-master
  before_script:
    - npm ci --cache .npm --prefer-offline

test:frontend:lint:
  stage: .pre
  extends:
    - .frontend-base
    - .frontend-test-rules
  allow_failure: false
  script:
    - npm run validate

test:frontend:unit:
  stage: .pre
  extends:
    - .frontend-base
    - .frontend-test-rules
  allow_failure: false
  parallel: 3
  script:
    - npx jest --ci --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL --maxWorkers=50%

test:frontend:integration:
  stage: .pre
  extends:
    - .frontend-base
    - .frontend-test-rules
  allow_failure: true
  script:
    - npx jest --config jest.integration.config.js --ci --maxWorkers=50%
