include:
  - project: 'urgent-couriers/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

# NuGet credentials for parent pipeline jobs (test:backend)
# NOTE: The child pipeline (Auto-DevOps Docker build) gets these via
# project-level CI/CD variables set in GitLab > Settings > CI/CD > Variables
variables:
  GITLAB_NUGET_USERNAME: "gitlab-ci-token"
  GITLAB_NUGET_TOKEN: "${CI_JOB_TOKEN}"

# Only run deploy on protected branches, not on MR pipelines
deploy-dynamic-pipeline:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_TAG

# Workflow rules - prioritize merge request pipelines to block merges on failure
workflow:
  rules:
    # Run pipeline for merge requests (blocks merge if tests fail)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run pipeline for protected branches after merge
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "staging"
    # Run pipeline for tags (releases)
    - if: $CI_COMMIT_TAG

# Shared rules for test jobs - only run on MRs targeting protected branches
.test-rules:
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"

# Test jobs - only run on merge requests targeting protected branches
test:backend:
  stage: .pre
  image: mcr.microsoft.com/dotnet/sdk:10.0
  retry:
    max: 2
    when: runner_system_failure
  allow_failure: false
  cache:
    key: dotnet-${CI_COMMIT_REF_SLUG}
    paths:
      - ~/.nuget/packages
  script:
    - dotnet restore
    - dotnet test DespatchWeb.Tests --verbosity normal --no-restore
  extends: .test-rules

# Frontend base configuration
.frontend-base:
  image: node:20-alpine
  retry:
    max: 2
    when: runner_system_failure
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .npm/
      - .jest-cache/
    policy: pull-push
    fallback_keys:
      - npm-master
      - npm-staging
  before_script:
    - npm ci --cache .npm --prefer-offline
  extends: .test-rules

# Lint - fast check, runs first
test:frontend:lint:
  stage: .pre
  extends: .frontend-base
  allow_failure: false
  script:
    - npm run lint --if-present
    - npm run type-check --if-present

# Fast unit tests for MR pipelines (no coverage)
test:frontend:unit:
  stage: .pre
  extends: .frontend-base
  allow_failure: false
  script:
    - npm test -- --ci

# Coverage job only runs on merge to protected branches
test:frontend:coverage:
  stage: .pre
  image: node:20-alpine
  retry:
    max: 2
    when: runner_system_failure
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .npm/
      - .jest-cache/
    policy: pull-push
    fallback_keys:
      - npm-master
      - npm-staging
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test -- --ci --coverage
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "staging"
