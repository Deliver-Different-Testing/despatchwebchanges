include:
  - project: 'urgent-couriers/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

# Test jobs - run on staging and master branches (before deploy)
test:backend:
  stage: .pre
  image: mcr.microsoft.com/dotnet/sdk:10.0
  retry:
    max: 2
    when: runner_system_failure
  allow_failure: false
  script:
    - dotnet restore
    - dotnet test DespatchWeb.Tests --verbosity normal --no-restore
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "fix/console-error-test"

test:frontend:
  stage: .pre
  image: node:20
  retry:
    max: 2
    when: runner_system_failure
  allow_failure: false
  variables:
    KUBERNETES_MEMORY_REQUEST: "2.5Gi"
    KUBERNETES_MEMORY_LIMIT: "3Gi"
    KUBERNETES_CPU_REQUEST: "1"
  script:
    - npm ci
    - npm test -- --maxWorkers=2
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "fix/console-error-test"
