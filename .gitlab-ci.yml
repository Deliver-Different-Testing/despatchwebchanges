include:
  - project: 'urgent-couriers/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

# Only run deploy on protected branches, not on MR pipelines
deploy-dynamic-pipeline:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_TAG

# Workflow rules - prioritize merge request pipelines to block merges on failure
workflow:
  rules:
    # Run pipeline for merge requests (blocks merge if tests fail)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run pipeline for protected branches after merge
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "staging"
    # Run pipeline for tags (releases)
    - if: $CI_COMMIT_TAG

# Shared rules for test jobs - run on MRs targeting protected branches
.test-rules:
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "master"

# Test jobs - run on staging and master branches (before deploy)
test:backend:
  stage: .pre
  image: mcr.microsoft.com/dotnet/sdk:10.0
  retry:
    max: 2
    when: runner_system_failure
  allow_failure: false
  cache:
    key: dotnet-${CI_COMMIT_REF_SLUG}
    paths:
      - ~/.nuget/packages
  script:
    - dotnet restore
    - dotnet test DespatchWeb.Tests --verbosity normal --no-restore
  extends: .test-rules

# Frontend base configuration
.frontend-base:
  image: node:20-alpine
  retry:
    max: 2
    when: runner_system_failure
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline
  extends: .test-rules

# Lint - fast check, runs first
test:frontend:lint:
  stage: .pre
  extends: .frontend-base
  allow_failure: false
  script:
    - npm run lint --if-present
    - npm run type-check --if-present

# Unit tests - runs in parallel with lint
test:frontend:unit:
  stage: .pre
  extends: .frontend-base
  allow_failure: false
  script:
    - npm test -- --ci --coverage --maxWorkers=2
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
