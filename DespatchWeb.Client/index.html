<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch - Deliver DFRNT</title>

    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260619">
    <link rel="alternate icon" type="image/x-icon" href="/dispmain.ico?v=20260619">

    <link rel="preload" as="image" href="/images/dfrnt_logo.png" fetchpriority="high">

    <script>
        // Resolve the saved colour mode before first paint so the loader doesn't flash
        // light. A separate attribute from Mantine's, dropped with the loader unless Mantine
        // owns the scheme by then. Mirrors hooks/useColorMode.tsx (key, 'system' default).
        (function () {
            try {
                var pref = localStorage.getItem('dd-color-mode');
                var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.setAttribute('data-dd-boot-scheme', 'dark');
            } catch (e) { /* storage or matchMedia unavailable — stay light */ }
        })();
    </script>
    <style>
        /* DFRNT brand hex is inlined rather than tokenised here: this block paints
           before any bundle stylesheet and before the SPA defines the theme vars. */
        :root {
            --theme-primary: #3bc7f4;
            --theme-primary-light: rgba(59, 199, 244, 0.15);
            --theme-primary-medium: rgba(59, 199, 244, 0.3);
            --theme-primary-strong: rgba(59, 199, 244, 0.5);
        }

        html, body {
            background-color: #f4f2f1;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* Mantine's body colour lives in a cascade layer, so this unlayered light background
           would win in dark mode unless the Mantine scheme is matched here. */
        html[data-mantine-color-scheme='dark'],
        html[data-mantine-color-scheme='dark'] body {
            background-color: var(--dd-surface);
            color: var(--mantine-color-text);
        }

        .text-error {
            color: #dc3246;
        }

        /* Dark start: the canvas must be dark too, or the page paints light before the
           loader exists. !important because udispatch.less pins html/body to the light
           background with !important once app.css loads, which is the white flash.
           The attribute is dropped with the loader unless Mantine took over the scheme.
           Values are the DFRNT dark surface ladder. */
        html[data-dd-boot-scheme='dark'],
        html[data-dd-boot-scheme='dark'] body {
            background-color: #2c2a30 !important;
        }

        html[data-dd-boot-scheme='dark'] .app-loader {
            background-color: #2c2a30;
        }

        .app-loader {
            position: fixed;
            inset: 0;
            background-color: #f4f2f1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 350ms ease-out;
        }

        .app-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* The asset bakes in its own clear-space, so the mark itself renders
           at roughly 214x51 inside this box. */
        .loader-logo {
            width: 260px;
            height: 88px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .loader-logo-dark,
        html[data-dd-boot-scheme='dark'] .loader-logo-light {
            display: none;
        }

        html[data-dd-boot-scheme='dark'] .loader-logo-dark {
            display: block;
        }

        .loading-text {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #6e6d80;
            letter-spacing: 0.01em;
        }

        .linear-progress {
            width: 200px;
            height: 4px;
            background-color: #e7e5e4;
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .linear-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            border-radius: 9999px;
            background-color: #3bc7f4;
            animation: indeterminate 1.8s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
        }

        @keyframes indeterminate {
            0% {
                left: -40%;
                width: 40%;
            }
            60% {
                left: 100%;
                width: 40%;
            }
            100% {
                left: 100%;
                width: 40%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .app-loader {
                transition: none;
            }

            .linear-progress-bar {
                animation: none;
                width: 100%;
                opacity: 0.55;
            }
        }
    </style>

    <script>
        function initMap() {
            console.log("Maps Loaded");
        }
    </script>

    <link rel="stylesheet" href="https://js.api.here.com/v3/3.2/mapsjs-ui.css"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
<!-- Full Screen Loader -->
<div class="app-loader" id="appLoader" role="status" aria-live="polite">
    <div class="loader-content">
        <img class="loader-logo loader-logo-light" src="/images/dfrnt_logo.png" width="260" height="88" alt="DFRNT">
        <img class="loader-logo loader-logo-dark" src="/images/dfrnt_logo_reversed.png" width="260" height="88" alt="DFRNT">
        <div class="linear-progress" role="progressbar" aria-label="Loading Dispatch">
            <div class="linear-progress-bar"></div>
        </div>
        <div class="loading-text">Loading&hellip;</div>
    </div>
</div>

<div id="root"></div>

<script src="https://js.api.here.com/v3/3.2/mapsjs-core.js"></script>
<script src="https://js.api.here.com/v3/3.2/mapsjs-service.js"></script>
<script src="https://js.api.here.com/v3/3.2/mapsjs-ui.js"></script>
<script src="https://js.api.here.com/v3/3.2/mapsjs-mapevents.js"></script>

<script type="module" src="/src/main.tsx"></script>

<script>
    // Safety net: never leave the loader up if the SPA fails to boot (main.tsx hides it on success).
    setTimeout(function () {
        var loader = document.getElementById('appLoader');
        if (!loader || loader.classList.contains('hidden')) return;
        loader.classList.add('hidden');
        setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
            var root = document.documentElement;
            if (!root.hasAttribute('data-mantine-color-scheme')) root.removeAttribute('data-dd-boot-scheme');
        }, 400);
    }, 15000);
</script>
</body>
</html>
