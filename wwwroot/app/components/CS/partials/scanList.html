<div class="scan-list-container" ng-if="scanList && scanList.length > 0">
    <md-table-container>
        <table md-dense
               md-progress="scanPromise"
               md-table>
            <thead md-head>
            <tr md-row>
                <th md-column>
                    <span>Date/Time</span>
                </th>
                <th md-column>
                    <span>Scan Detail</span>
                </th>
                <th md-column>
                    <span>Courier</span>
                </th>
            </tr>
            </thead>
            <tbody md-body>
            <tr context-menu="scanListMenu"
                data-index="{{$index}}"
                data-scanid="{{scan.bulkScanId}}"
                md-row
                ng-class="{'selected': selected.indexOf(scan) > -1}"
                ng-repeat="scan in scanList">
                <td md-cell>{{scan.scanDateTime | date: "dd/MM/yyyy h:mm:a"}}</td>
                <td md-cell>{{scan.scanDetail}}</td>
                <td md-cell>{{scan.courier}}</td>
            </tr>
            </tbody>
        </table>
    </md-table-container>
</div>

<no-data
        ng-if="!scanList || scanList.length == 0"
        title="No Scans Available"
        message="This job has no scan records. Please use the driver application to scan the job items."
        icon="qr_code_scanner"
        show-action="false">
</no-data>
