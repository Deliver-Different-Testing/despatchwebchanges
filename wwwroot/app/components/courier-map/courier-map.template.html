<!-- React App Shell (Toolbar + Side Navigation) -->
<react-app-shell title="Courier Map"></react-app-shell>

<div class="courier-map-container" layout="column" flex>
    <!-- Map Container -->
    <div class="map-wrapper" flex>
        <!-- HERE Maps Component -->
        <here-map-react
                map-id="courierMap"
                credentials="ctrl.hereMapCredentials"
                config="ctrl.hereMapConfig"
                on-map-ready="ctrl.onMapReady(map, platform)"
                ng-if="ctrl.hereMapCredentials && ctrl.hereMapConfig">
        </here-map-react>

        <!-- Active Drivers Panel -->
        <div class="drivers-panel"
             ng-class="{'panel-hidden': ctrl.isPanelHidden, 'panel-animating': ctrl.isPanelAnimating}">

            <!-- Panel Content -->
            <div class="panel-content">
                <!-- Header -->
                <div class="panel-header">
                    <div class="header-left">
                        <span class="panel-title">Active Drivers</span>
                        <span class="driver-count-badge" ng-if="ctrl.totalActiveDrivers > 0">{{ctrl.totalActiveDrivers}}</span>
                    </div>
                    <button class="refresh-btn"
                            ng-click="ctrl.refreshData()"
                            ng-disabled="ctrl.dataLoading"
                            aria-label="Refresh drivers">
                        <md-icon md-font-set="material-symbols-outlined"
                                 ng-class="{'spin': ctrl.dataLoading}">sync</md-icon>
                        <md-tooltip md-direction="bottom">Refresh driver locations</md-tooltip>
                    </button>
                </div>

                <!-- Search -->
                <div class="search-box">
                    <md-icon md-font-set="material-symbols-outlined" class="search-icon">search</md-icon>
                    <input type="text"
                           ng-model="ctrl.searchTerm"
                           ng-model-options="{ debounce: 150 }"
                           placeholder="Search drivers..."
                           aria-label="Search drivers">
                    <button class="clear-btn"
                            ng-if="ctrl.searchTerm"
                            ng-click="ctrl.clearSearch()"
                            aria-label="Clear search">
                        <md-icon md-font-set="material-symbols-outlined">close</md-icon>
                    </button>
                </div>

                <!-- Driver List -->
                <div class="driver-list-wrapper">
                    <!-- Loading State -->
                    <div class="state-container" ng-if="ctrl.dataLoading">
                        <md-progress-circular md-mode="indeterminate" md-diameter="36"></md-progress-circular>
                        <span class="state-text">Loading drivers...</span>
                    </div>

                    <!-- No Drivers State -->
                    <div class="state-container" ng-if="!ctrl.dataLoading && ctrl.drivers.length === 0">
                        <md-icon md-font-set="material-symbols-outlined" class="state-icon">person_off</md-icon>
                        <span class="state-text">No active drivers</span>
                    </div>

                    <!-- No Search Results State -->
                    <div class="state-container" ng-if="!ctrl.dataLoading && ctrl.drivers.length > 0 && ctrl.filteredDrivers.length === 0">
                        <md-icon md-font-set="material-symbols-outlined" class="state-icon">search_off</md-icon>
                        <span class="state-text">No matches found</span>
                    </div>

                    <!-- Driver List -->
                    <div class="driver-list" ng-if="!ctrl.dataLoading && ctrl.filteredDrivers.length > 0">
                        <div class="driver-row"
                             ng-repeat="driver in ctrl.filteredDrivers track by driver.courierId"
                             ng-click="ctrl.centerOnDriver(driver)">
                            <div class="driver-avatar"
                                 ng-style="{'background-color': ctrl.getDriverColor(driver.courierId)}">
                                {{ctrl.getDriverInitials(driver.courierName)}}
                            </div>
                            <div class="driver-info">
                                <div class="driver-name">{{driver.courierName}}</div>
                                <div class="driver-meta">
                                    <span class="driver-code" ng-if="driver.code">{{driver.code}}</span>
                                    <span class="driver-jobs" ng-if="driver.totalJobs > 0">
                                        <md-icon md-font-set="material-symbols-outlined">work</md-icon>
                                        {{driver.totalJobs}} {{driver.totalJobs === 1 ? 'job' : 'jobs'}}
                                    </span>
                                </div>
                            </div>
                            <md-icon md-font-set="material-symbols-outlined" class="locate-btn">near_me</md-icon>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Toggle Button -->
            <button class="toggle-btn"
                    ng-click="ctrl.togglePanel()"
                    aria-label="Toggle drivers panel">
                <md-icon md-font-set="material-symbols-outlined"
                         ng-class="{'rotated': ctrl.isPanelHidden}">
                    chevron_right
                </md-icon>
                <md-tooltip md-direction="left">{{ctrl.isPanelHidden ? 'Show' : 'Hide'}} drivers panel</md-tooltip>
            </button>
        </div>

        <!-- Map Controls -->
        <div class="map-controls">
            <button class="map-control-btn"
                    ng-click="ctrl.returnToOverview()"
                    aria-label="Return to overview">
                <md-icon md-font-set="material-symbols-outlined">fit_screen</md-icon>
                <md-tooltip md-direction="left">Fit all drivers in view</md-tooltip>
            </button>
            <button class="map-control-btn"
                    ng-click="ctrl.refreshData()"
                    ng-disabled="ctrl.dataLoading"
                    aria-label="Refresh data">
                <md-icon md-font-set="material-symbols-outlined"
                         ng-class="{'spin': ctrl.dataLoading}">sync</md-icon>
                <md-tooltip md-direction="left">Refresh locations</md-tooltip>
            </button>
        </div>
    </div>
</div>
