<div class="dfrnt-loader-component">
    <div class="loader-container" ng-if="ctrl.isLoading">
        <div class="full-height" layout="row" layout-align="center center">
            <div class="material-icon-loader">
                <md-progress-circular md-diameter="60" md-mode="indeterminate"></md-progress-circular>
                <md-icon class="loader-icon" md-font-set="material-symbols-outlined">{{ctrl.iconName}}</md-icon>
            </div>
        </div>
    </div>
</div>
