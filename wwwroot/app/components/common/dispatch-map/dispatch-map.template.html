<div class="dispatch-map-component">
    <div class="dispatch-map-container">
        <div class="map-wrapper" style="height: 100%; width: 100%; position: absolute;">
            <!-- Loading Indicator -->
            <div class="loader-container" ng-if="!ctrl.googleMapsUrl">
                <div class="full-height" layout="row" layout-align="center center">
                    <div class="material-icon-loader">
                        <md-progress-circular md-diameter="60" md-mode="indeterminate"></md-progress-circular>
                        <md-icon class="loader-icon" md-font-set="material-symbols-outlined">map</md-icon>
                    </div>
                </div>
            </div>

            <!-- Map -->
            <div map-lazy-load="https://maps.google.com/maps/api/js"
                 map-lazy-load-params="{{ctrl.googleMapsUrl}}"
                 ng-if="ctrl.googleMapsUrl"
                 style="height: 100%; width: 100%;">
                <ng-map id="dispatchMap"
                        center="{{ctrl.mapCenter.lat}}, {{ctrl.mapCenter.lng}}"
                        map-type-id="roadmap"
                        street-view-control="false"
                        style="width: 100%; height: 100%;"
                        zoom="{{ctrl.mapZoom}}">
                </ng-map>
            </div>

            <!-- Map Controls -->
            <div class="map-controls">
                <md-button class="md-fab md-mini" ng-class="{'md-primary': ctrl.autoZoomEnabled, 'md-warn': !ctrl.autoZoomEnabled}" aria-label="Toggle Auto Zoom" ng-click="ctrl.toggleAutoZoom()">
                    <md-tooltip md-direction="right">{{ctrl.autoZoomEnabled ? 'Auto Zoom Enabled' : 'Auto Zoom Disabled'}}</md-tooltip>
                    <md-icon md-font-set="material-symbols-outlined">{{ctrl.autoZoomEnabled ? 'fit_screen' : 'zoom_out_map'}}</md-icon>
                </md-button>
            </div>
        </div>
    </div>
</div>
