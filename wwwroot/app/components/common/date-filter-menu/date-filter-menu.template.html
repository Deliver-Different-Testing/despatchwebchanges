<md-menu>
    <md-button
            aria-label="Open date filter menu"
            class="md-icon-button"
            ng-click="$mdMenu.open($event)">
        <md-icon md-font-set="material-symbols-outlined">calendar_today</md-icon>
        <md-tooltip md-direction="bottom">Date Filter</md-tooltip>
    </md-button>

    <md-menu-content class="date-filter-menu">
        <div md-prevent-menu-close>
            <!-- Professional Header -->
            <md-toolbar class="md-primary md-hue-2 date-filter-header">
                <div class="md-toolbar-tools">
                    <md-icon class="header-icon" md-font-set="material-symbols-outlined">date_range</md-icon>
                    <h3 class="md-title">Date Range Filter</h3>
                    <span flex></span>
                    <span class="timezone-label">{{::ctrl.browserTimeZone | timezoneShort}}</span>
                </div>
            </md-toolbar>

            <div class="date-filter-content">
                <!-- Range Type Selection -->
                <div class="range-selection-section">
                    <md-radio-group
                            class="md-primary range-radio-group"
                            ng-change="ctrl.onSearchRangeChange(ctrl.dateSearchRange)"
                            ng-model="ctrl.dateSearchRange"
                            aria-label="Date range selection">
                        <md-radio-button value="1" class="range-option">
                            <span class="option-label">Last 24 Hours</span>
                        </md-radio-button>
                        <md-radio-button value="2" class="range-option">
                            <span class="option-label">Custom Date Range</span>
                        </md-radio-button>
                    </md-radio-group>
                </div>

                <!-- Custom Date Range Section -->
                <div class="custom-date-section" ng-if="ctrl.dateSearchRange == 2">
                    <md-divider class="section-divider"></md-divider>

                    <div class="date-picker-container" layout="row" layout-xs="column" layout-align="space-between start">
                        <!-- From Date/Time -->
                        <md-input-container class="md-auto-horizontal-margin date-time-picker" flex>
                            <label>
                                <md-icon class="date-icon" md-font-set="material-symbols-outlined">event</md-icon>
                                Start Date/Time
                            </label>
                            <input mdc-datetime-picker
                                   date="true"
                                   time="false"
                                   type="text"
                                   placeholder="Select start date"
                                   minutes="true"
                                   edit-input="true"
                                   max-date="ctrl.dateFilterData.endDate"
                                   show-icon="false"
                                   ng-model="ctrl.dateFilterData.startDate"
                                   ng-change="ctrl.refreshData()"
                                   ng-model-options="{ debounce: 500 }"
                                   class="dtp-no-msclear dtp-input md-input"
                                   aria-label="Start date"
                                   aria-describedby="start-date-help">
                            <span id="start-date-help" class="sr-only">Select the start date for filtering</span>
                        </md-input-container>

                        <!-- To Date/Time -->
                        <md-input-container class="md-auto-horizontal-margin date-time-picker" flex>
                            <label>
                                <md-icon class="date-icon" md-font-set="material-symbols-outlined">event</md-icon>
                                End Date/Time
                            </label>
                            <input mdc-datetime-picker
                                   date="true"
                                   time="false"
                                   type="text"
                                   placeholder="Select end date"
                                   minutes="true"
                                   edit-input="true"
                                   min-date="ctrl.dateFilterData.startDate"
                                   show-icon="false"
                                   ng-model="ctrl.dateFilterData.endDate"
                                   ng-change="ctrl.refreshData()"
                                   ng-model-options="{ debounce: 500 }"
                                   class="dtp-no-msclear dtp-input md-input"
                                   aria-label="End date"
                                   aria-describedby="end-date-help">
                            <span id="end-date-help" class="sr-only">Select the end date for filtering</span>
                        </md-input-container>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div layout="row" layout-align="end center">
                    <md-button class="md-raised" ng-click="ctrl.clearDateFilter()">
                        Reset to Default
                    </md-button>
                </div>
            </div>
        </div>
    </md-menu-content>
</md-menu>
