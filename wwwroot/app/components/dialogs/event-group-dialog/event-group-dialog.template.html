<md-dialog aria-label="Task Groups Table" class="event-dialog">
    <form ng-cloak>
        <md-toolbar class="md-hue-1">
            <div class="md-toolbar-tools">
                <h2>Task Groups Management</h2>
                <span flex></span>
                <md-button class="md-icon-button close-dialog-button" ng-click="ctrl.cancel()">
                    <md-icon md-font-set="material-symbols-outlined">close</md-icon>
                </md-button>
            </div>
        </md-toolbar>

        <md-dialog-content>
            <div ng-if="ctrl.events && ctrl.events.length > 0" class="content-wrapper">
                <div class="table-header">
                    <div>
                        <h3 class="table-title">Active Task Groups</h3>
                        <p class="table-subtitle">Manage task assignments and schedules</p>
                    </div>
                </div>

                <md-table-container>
                    <table md-table>
                        <thead md-head>
                        <tr md-row>
                            <th md-column class="task-type-col">Task Type</th>
                            <th md-column class="group-col">Group</th>
                            <th md-column class="sequence-col">Sequence</th>
                            <th md-column class="due-date-col">
                                Due Date
                                <div class="timezone-display">({{::ctrl.browserTimeZone | timezoneShort}})</div>
                            </th>
                            <th md-column class="assign-col">Assign To</th>
                            <th md-column class="active-col">Active</th>
                        </tr>
                        </thead>
                        <tbody md-body>
                        <tr md-row ng-repeat="item in ctrl.events">
                            <td md-cell class="task-type-cell">{{::item.eventType.text}}</td>
                            <td md-cell>
                                <span class="group-badge">{{::item.group}}</span>
                            </td>
                            <td md-cell>
                                <span class="sequence-badge">{{::item.sequence}}</span>
                            </td>
                            <td md-cell>
                                <md-input-container class="date-input">
                                    <input mdc-datetime-picker
                                           date="true" time="true" type="text"
                                           id="datetimeedit-{{$index}}"
                                           show-todays-date=""
                                           minutes="true"
                                           short-time="false"
                                           min-date="ctrl.minDate"
                                           max-date="ctrl.maxDate"
                                           edit-input="true"
                                           show-icon="true"
                                           ng-model="item.dueTime"
                                           name="datetimeedit"
                                           required
                                           class="dtp-no-msclear dtp-input md-input">
                                </md-input-container>
                            </td>
                            <td md-cell>
                                <md-autocomplete
                                        md-selected-item="item.assignTo"
                                        md-search-text="item.searchText"
                                        md-items="user in ctrl.querySearch(item.searchText, $index)"
                                        md-item-text="user.text"
                                        md-floating-label=""
                                        placeholder="Search User..."
                                        md-escape-options="clear"
                                        md-input-name="assignTo"
                                        md-autocomplete-enter-select
                                        md-no-asterisk="true"
                                        md-min-length="2"
                                        md-selected-item-change="ctrl.selectedUserChange(user, $index)">
                                    <md-item-template>
                                        <span md-highlight-text="item.searchText">{{user.text}}</span>
                                    </md-item-template>
                                </md-autocomplete>
                            </td>
                            <td md-cell>
                                <md-checkbox
                                        class="md-primary"
                                        ng-model="item.active"
                                        aria-label="Active">
                                </md-checkbox>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </md-table-container>
            </div>

            <no-data-react
                    ng-if="!ctrl.events || ctrl.events.length === 0"
                    title="No Task Groups Found"
                    message="Get started by adding task types in the Admin Manager to create your first task group."
                    icon="event_busy"
                    show-action="true"
                    action-text="Open Admin Manager"
                    on-action="ctrl.goToAdminManager()">
            </no-data-react>
        </md-dialog-content>

        <md-dialog-actions layout="row">
            <span flex></span>
            <md-button ng-click="ctrl.cancel()">Cancel</md-button>
            <md-button
                    class="md-primary md-raised"
                    ng-click="ctrl.save(ctrl.jobId, ctrl.events)"
                    ng-disabled="!ctrl.events || ctrl.events.length === 0">
                <md-icon md-font-set="material-symbols-outlined">save</md-icon>
                Save Changes
            </md-button>
        </md-dialog-actions>
    </form>
</md-dialog>
