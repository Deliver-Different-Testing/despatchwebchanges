<md-dialog aria-label="{{ ::ctrl.title }}" class="date-time-dialog">
    <md-toolbar class="md-hue-1">
        <div class="md-toolbar-tools">
            <md-icon class="popup-icon" md-font-set="material-symbols-outlined">today</md-icon>
            <h2>{{ ::ctrl.title }}</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="ctrl.cancel()" aria-label="Close dialog">
                <md-icon md-font-set="material-symbols-outlined">close</md-icon>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content class="dialog-content">
        <div class="content-wrapper">
            <!-- Date and Time Picker -->
            <div class="input-section" ng-if="ctrl.showDate && ctrl.showTime">
                <div class="input-group">
                    <md-input-container class="md-block date-input">
                        <label for="dateInput">Date</label>
                        <input
                                type="date"
                                id="dateInput"
                                ng-model="ctrl.selectedDate"
                                ng-change="ctrl.updateDateTime()"
                                class="md-input"
                                required>
                    </md-input-container>
                    <md-input-container class="md-block time-input">
                        <label for="timeInput">Time (24-hour)</label>
                        <input type="time"
                               id="timeInput"
                               ng-model="ctrl.selectedTime"
                               ng-change="ctrl.updateDateTime()"
                               class="md-input"
                               step="60"
                               required>
                    </md-input-container>
                </div>
            </div>

            <!-- Date Only Picker -->
            <div class="input-section" ng-if="ctrl.showDate && !ctrl.showTime">
                <md-input-container class="md-block">
                    <label for="dateOnlyInput">Date</label>
                    <input type="date"
                           id="dateOnlyInput"
                           ng-model="ctrl.selectedDate"
                           ng-change="ctrl.updateDateTime()"
                           class="md-input"
                           required>
                </md-input-container>
            </div>

            <!-- Time Only Picker -->
            <div class="input-section" ng-if="ctrl.showTime && !ctrl.showDate">
                <md-input-container class="md-block">
                    <label for="timeOnlyInput">Time (24-hour)</label>
                    <input type="time"
                           id="timeOnlyInput"
                           ng-model="ctrl.selectedTime"
                           ng-change="ctrl.updateDateTime()"
                           class="md-input"
                           step="60"
                           required>
                </md-input-container>
            </div>

            <!-- Timezone Information -->
            <div class="timezone-info">
                <div class="timezone-item">
                    <md-icon class="md-primary timezone-icon" md-font-set="material-symbols-outlined">public</md-icon>
                    <div class="timezone-details">
                        <span class="timezone-label">Your timezone</span>
                        <span class="timezone-value">{{ ::ctrl.browserTimeZone | timezoneLongFilter }}</span>
                    </div>
                </div>
                <div class="timezone-item">
                    <md-icon class="md-primary timezone-icon" md-font-set="material-symbols-outlined">work</md-icon>
                    <div class="timezone-details">
                        <span class="timezone-label">Job timezone</span>
                        <span class="timezone-value">{{ ctrl.selectedTimeZone | timezoneLongFilter }}</span>
                    </div>
                </div>
            </div>
        </div>
    </md-dialog-content>

    <md-dialog-actions layout="row">
        <span flex></span>
        <md-button ng-click="ctrl.cancel()" ng-if="!ctrl.isLoading">
            Cancel
        </md-button>
        <md-progress-circular md-diameter="24"
                              md-mode="indeterminate"
                              ng-if="ctrl.isLoading">
        </md-progress-circular>
        <md-button
                class="md-raised md-primary"
                ng-click="ctrl.submit()"
                ng-disabled="!ctrl.isValid()"
                ng-if="!ctrl.isLoading">
            Save
        </md-button>
    </md-dialog-actions>
</md-dialog>
