<md-dialog aria-label="{{ ::ctrl.title }}" class="date-time-dialog">
    <md-toolbar class="md-hue-1">
        <div class="md-toolbar-tools">
            <md-icon class="popup-icon" md-font-set="material-symbols-outlined">today</md-icon>
            <h2>{{ ::ctrl.title }}</h2>
            <span flex></span>
            <md-button class="md-icon-button close-dialog-button" ng-click="ctrl.cancel()">
                <md-icon md-font-set="material-symbols-outlined">close</md-icon>
                <md-tooltip md-direction="bottom">Close</md-tooltip>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content class="dialog-content">
        <div class="content-wrapper">
            <!-- Custom timepicker Component-->
            <custom-date-picker
                    date-time="ctrl.dateTime"
                    show-date="ctrl.showDate"
                    show-time="ctrl.showTime"
                    on-change="ctrl.updateDateTime(dateTime)">
            </custom-date-picker>

            <!-- Timezone Information -->
            <div class="timezone-info" ng-if="::ctrl.isUsCustomer">
                <div class="timezone-item">
                    <md-icon class="md-primary timezone-icon" md-font-set="material-symbols-outlined">
                        public
                        <md-tooltip md-direction="bottom">Your local timezone (for reference only)</md-tooltip>
                    </md-icon>
                    <div class="timezone-details">
                        <span class="timezone-label">Your timezone</span>
                        <span class="timezone-value">{{ ::ctrl.browserTimeZoneStr }}</span>
                    </div>
                </div>
                <div class="timezone-item">
                    <md-icon class="md-primary timezone-icon" md-font-set="material-symbols-outlined">
                        work
                        <md-tooltip md-direction="bottom">The date you enter will be saved in this timezone</md-tooltip>
                    </md-icon>
                    <div class="timezone-details">
                        <span class="timezone-label">Job timezone</span>
                        <span class="timezone-value">{{ ctrl.selectedTimeZoneStr }}</span>
                    </div>
                </div>
            </div>
        </div>
    </md-dialog-content>

    <md-dialog-actions layout="row">
        <span flex></span>
        <md-button ng-click="ctrl.cancel()" ng-if="!ctrl.isLoading">
            Cancel
        </md-button>
        <md-progress-circular md-diameter="24"
                              md-mode="indeterminate"
                              ng-if="ctrl.isLoading">
        </md-progress-circular>
        <md-button
                class="md-raised md-primary"
                ng-click="ctrl.submit()"
                ng-if="!ctrl.isLoading">
            Save
        </md-button>
    </md-dialog-actions>
</md-dialog>
