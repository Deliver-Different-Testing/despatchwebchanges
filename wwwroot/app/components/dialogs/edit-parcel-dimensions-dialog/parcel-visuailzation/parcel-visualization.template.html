<div class="parcel-visualization-container" layout="column" layout-align="center center">
    <div ng-if="!ctrl.hasValidDimensions" layout="column" layout-align="center center" layout-padding class="md-padding" flex>
        <md-icon md-font-set="material-symbols-outlined" class="md-primary md-hue-1" style="font-size: 48px; height: 48px; width: 48px;">view_in_ar</md-icon>
        <p class="md-caption md-text-muted">Enter dimensions to see visualization</p>
    </div>

    <div ng-if="ctrl.hasValidDimensions" class="svg-container" flex layout="row" layout-align="center center">
        <svg width="100%" height="100%" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet" class="parcel-svg">
            <g ng-attr-transform="rotate(15) translate(-{{ ctrl.normalizedWidth * 0.3 }}, -{{ ctrl.normalizedHeight * 0.3 }}) scale({{ ctrl.fixedScale }})" class="parcel-group">
                <!-- Front face -->
                <rect
                        ng-attr-width="{{ ctrl.normalizedWidth }}"
                        ng-attr-height="{{ ctrl.normalizedHeight }}"
                        fill="#E3F2FD"
                        stroke="#2196F3"
                        stroke-width="2"
                        x="0"
                        y="0">
                </rect>

                <!-- Top face -->
                <path
                        ng-attr-d="M0,0 l{{ ctrl.normalizedLength * -0.5 }},{{ ctrl.normalizedLength * -0.3 }} h{{ ctrl.normalizedWidth }} l{{ ctrl.normalizedLength * 0.5 }},{{ ctrl.normalizedLength * 0.3 }} z"
                        fill="#BBDEFB"
                        stroke="#2196F3"
                        stroke-width="2">
                </path>

                <!-- Side face -->
                <path
                        ng-attr-d="M{{ ctrl.normalizedWidth }},0 l{{ ctrl.normalizedLength * 0.5 }},{{ ctrl.normalizedLength * -0.3 }} v{{ ctrl.normalizedHeight }} l{{ ctrl.normalizedLength * -0.5 }},{{ ctrl.normalizedLength * 0.3 }} z"
                        fill="#90CAF9"
                        stroke="#2196F3"
                        stroke-width="2">
                </path>

                <!-- Basic dimension labels -->
                <text
                        ng-attr-x="{{ ctrl.normalizedWidth / 2 }}"
                        ng-attr-y="{{ ctrl.normalizedHeight + 15 }}"
                        text-anchor="middle"
                        font-size="10"
                        fill="#1976D2"
                        class="dimension-label md-body-1">
                    W: {{ ctrl.width }}"
                </text>

                <text
                        ng-attr-x="{{ ctrl.normalizedWidth + 10 }}"
                        ng-attr-y="{{ ctrl.normalizedHeight / 2 }}"
                        text-anchor="start"
                        font-size="10"
                        fill="#1976D2"
                        class="dimension-label md-body-1">
                    H: {{ ctrl.height }}"
                </text>

                <text
                        ng-attr-x="{{ ctrl.normalizedWidth / 2 - (ctrl.normalizedLength * 0.25) }}"
                        ng-attr-y="{{ ctrl.normalizedLength * -0.3 - 5 }}"
                        text-anchor="middle"
                        font-size="10"
                        fill="#1976D2"
                        class="dimension-label md-body-1">
                    L: {{ ctrl.length }}"
                </text>
            </g>
        </svg>
    </div>

    <!-- Simple dimensions summary - centered -->
    <div ng-if="ctrl.hasValidDimensions" class="dimensions-info" layout="row" layout-align="center center" layout-padding>
        <md-chip class="md-primary">
            <md-icon md-font-set="material-symbols-outlined">straighten</md-icon>
            {{ ctrl.length }}" × {{ ctrl.width }}" × {{ ctrl.height }}"
        </md-chip>
        <md-chip class="md-accent">
            <md-icon md-font-set="material-symbols-outlined">view_in_ar</md-icon>
            {{ ctrl.calculateVolume() | number:1 }} in³
        </md-chip>
    </div>
</div>
