<md-dialog aria-label="{{ ctrl.title }}" id="{{ ctrl.id }}">
    <md-toolbar class="md-hue-1">
        <div class="md-toolbar-tools">
            <md-icon class="popup-icon" md-font-set="material-symbols-outlined">checklist</md-icon>
            <h2>Edit {{ ctrl.title }}</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="ctrl.cancel()">
                <md-tooltip md-direction="bottom">Cancel</md-tooltip>
                <md-icon aria-label="Close dialog" md-font-set="material-symbols-outlined">
                    close
                </md-icon>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content>
        <div class="md-dialog-content">
            <form ng-submit="ctrl.submit(ctrl.selectedOption)">

                <!-- Select field -->
                <md-select
                        aria-label="Select an option"
                        ng-model="ctrl.selectedOption"
                        placeholder="{{ ctrl.options.placeholder }}">
                    <md-option ng-repeat="item in ctrl.options.items" ng-value="item">
                        {{ item.text }}
                    </md-option>
                </md-select>

                <!-- Warning Message -->
                <div class="warning-message" ng-if="ctrl.warningMessage"
                     style="margin: 16px auto; padding: 12px; background-color: #FFF3E0; border-left: 4px solid #FF9800; color: rgba(0,0,0,0.87); max-width: 400px; width: 100%;">
                    <div style="display: flex; align-items: start;">
                        <md-icon md-font-set="material-symbols-outlined" style="margin-right: 8px; color: #FF9800;">
                            warning
                        </md-icon>
                        <span>{{ ctrl.warningMessage }}</span>
                    </div>
                </div>

                <div ng-show="ctrl.showCheckbox" style="display: flex; justify-content: center; align-items: center;">
                    <div>
                        <md-divider></md-divider>

                        <!-- Checkbox -->
                        <md-checkbox aria-label="Checkbox" ng-model="ctrl.checkboxValue">
                            {{ ctrl.checkboxLabel }}
                        </md-checkbox>
                    </div>
                </div>

            </form>
        </div>
    </md-dialog-content>

    <md-dialog-actions>
        <md-progress-circular
                class="md-primary"
                md-diameter="40"
                md-mode="indeterminate"
                ng-disabled="!ctrl.selectedOption"
                ng-show="ctrl.isLoading">
        </md-progress-circular>

        <md-button class="md-raised md-primary" ng-click="ctrl.submit(ctrl.selectedOption)"
                   ng-disabled="!ctrl.selectedOption"
                   ng-show="!ctrl.isLoading">
            Save
        </md-button>
    </md-dialog-actions>
</md-dialog>
