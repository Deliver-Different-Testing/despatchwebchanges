<div class="droppable-box" style="min-height:500px">
    <md-table-container>
        <table md-progress="promise" md-row-select md-table multiple ng-model="selectedPrebooks">
            <thead md-head md-order="jobQuery.order">
            <tr md-row>
                <th md-column md-order-by="booked">Booked</th>
                <th md-column md-order-by="speed">Speed</th>
                <th md-column md-order-by="jobNo">Job</th>
                <th md-column md-order-by="client">Client</th>
                <th md-column md-order-by="from">From</th>
                <th md-column md-order-by="to">To</th>
                <th md-column md-order-by="code">Code</th>
                <th md-column>Actions</th>
            </tr>
            </thead>

            <tbody md-body>
            <tr class="droppable-row draggable-row"
                data-courier="{{job.courier}}"
                data-jobNo="{{job.jobNo}}"
                data-jobid="{{job.id}}"
                md-row
                ng-click="selectJobDetail(job.id);"
                ng-mouseup="job in pagedData | filter: searchText">

                <td md-cell>{{job.booked | date: "HH:mm"}}</td>
                <td md-cell>{{job.speed}}</td>
                <td md-cell>{{job.jobNo}}</td>
                <td md-cell ng-click="clientColumnClick($event); $event.stopPropagation()">{{job.client}}</td>
                <td context-menu="setCurrentWorkMenu" md-cell>
                    {{isUsCustomer ? job.pickupAddress.fullAddress : job.fromAddress}}
                </td>
                <td context-menu="setCurrentWorkMenu" md-cell>
                    {{isUsCustomer ? job.deliveryAddress.fullAddress : job.toAddress}}
                </td>
                <td md-cell>{{job.courier}}</td>
                <td md-cell>
                    <md-button class="md-icon-button" ng-click="sendPrebookJob(job.id); $event.stopPropagation()"
                               title="Send">
                        <md-icon md-font-set="material-symbols-outlined">send</md-icon>
                    </md-button>
                    <md-button class="md-icon-button" ng-click="voidPrebookJob(job.id); $event.stopPropagation()"
                               title="Void">
                        <md-icon md-font-set="material-symbols-outlined">delete</md-icon>
                    </md-button>
                </td>
            </tr>
            </tbody>
        </table>
    </md-table-container>
</div>
