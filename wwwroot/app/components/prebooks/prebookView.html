<div>
    <div>
        <md-toolbar class="md-hue-2">
            <div class="md-toolbar-tools">
                <img alt="logo" class="logo" src="/images/DFRNT-logo.png"/>

                <span flex></span>

                <md-button aria-label="Menu" class="md-icon-button" ng-click="toggleSidenav()"
                           ng-mouseover="toggleSidenav()">
                    <md-icon md-font-set="material-symbols-outlined">menu</md-icon>
                </md-button>
            </div>
        </md-toolbar>

        <material-sidenav></material-sidenav>
    </div>


    <div class="">
        <div class="columns">
            <div class="column" id="co-{{column.id}}" ng-repeat="(colKey,column) in layout.columns"
                 r-directions="['right']"
                 r-flex="true" resizable style="flex-basis: {{column.width}}">
                <div class="column-sortable" ng-model="column.boxes" ui-sortable="sortableOptions">
                    <div class="box" id="box-{{box.name}}" ng-repeat="(boxName,box) in column.boxes"
                         r-directions="['bottom']"
                         r-flex="true" resizable style="flex-basis: {{box.height}}">

                        <md-toolbar class="md-accent">
                            <div class="md-toolbar-tools">

                            <span class="md-headline-title" flex>{{boxes[box.name].title}} <span
                                    ng-if="box.name == 'scanList'">{{currentSelection}}</span>
                            </span>

                                <!--    Send all -->
                                <md-button class="md-icon-button" ng-click="sendAllSelectPrebookJobs(selectedPrebooks)"
                                           ng-if="selectedPrebooks && selectedPrebooks.length > 0">
                                    <md-tooltip md-direction="bottom">Send All Selected</md-tooltip>
                                    <md-icon md-font-set="material-symbols-outlined">send</md-icon>
                                </md-button>

                                <!--    Void all -->
                                <md-button class="md-icon-button" ng-click="voidAllSelectPrebookJobs(selectedPrebooks)"
                                           ng-if="selectedPrebooks && selectedPrebooks.length > 0">
                                    <md-tooltip md-direction="bottom">Void All Selected</md-tooltip>
                                    <md-icon md-font-set="material-symbols-outlined">block</md-icon>
                                </md-button>

                                <!-- Refresh -->
                                <md-button class="md-icon-button md-primary" ng-click="refreshData()"
                                           ng-if="boxes[box.name].showRefresh">
                                    <md-icon md-font-set="material-symbols-outlined">refresh</md-icon>
                                </md-button>

                                <div ng-if="box.name == 'eventList'">
                                    <input ng-model="searchBox" placeholder="Search Events..." type="text"/>
                                    <div class="results" ng-if="searchBox">
                                        <ul>
                                            <li class="result"
                                                ng-mousedown="selectEvent(event)"
                                                ng-repeat="event in filteredEvents = ( allEvents | filter: searchBox) | limitTo:10">
                                                {{event.jobNumber}}<br/> <small
                                                    class="address">{{event.courierName}} {{event.courierCode}}</small>
                                            </li>
                                        </ul>
                                        <small ng-hide="filteredEvents.length">No results</small>
                                    </div>
                                </div>

                                <div ng-if="box.name == 'eventList'">
                                    <md-checkbox aria-label="Include Closed" ng-change="refreshData(true)"
                                                 ng-model="pickDateService.includeClosed">
                                        Include Closed?
                                    </md-checkbox>
                                    <div layout="row" ng-if="isAdmin">
                                        <md-radio-group ng-change="refreshData(true)" ng-model="followupClient.name">
                                            <md-radio-button value="All">
                                                All
                                            </md-radio-button>
                                            <md-radio-button value="UCL">
                                                UCL
                                            </md-radio-button>
                                            <md-radio-button value="Client">
                                                Client
                                            </md-radio-button>
                                        </md-radio-group>
                                    </div>

                                    <div aria-label="Basic example" class="btn-group" role="group">
                                        ri
                                        F
                                        <!--<button type="button" class="btn btn-sm btn-secondary" title="Choose Date" ng-click="chooseDate()"><i class="fa fa-calendar-alt"></i></button>-->
                                    </div>
                                </div>


                                <div ng-if="box.name == 'jobDetail'">
                                    <md-button aria-label="reply" class="md-icon-button"
                                               ng-click="reply(currentEvent)"
                                               ng-if="currentEvent && !currentEvent.closedDate">
                                        <md-tooltip md-direction="bottom">Reply</md-tooltip>
                                        <md-icon md-font-icon="reply" md-font-set="material-symbols-outlined"></md-icon>
                                    </md-button>

                                    <md-button aria-label="copy link" class="md-icon-button"
                                               ng-click="generateDirectLink(currentEvent)"
                                               ng-if="currentEvent && ((isAdmin && !currentEvent.internal) || (!isAdmin && !currentEvent.internal))">
                                        <md-tooltip md-direction="bottom">Copy Link</md-tooltip>
                                        <md-icon md-font-icon="link" md-font-set="material-symbols-outlined"></md-icon>
                                    </md-button>

                                    <md-button aria-label="email photo proof of delivery" class="md-icon-button"
                                               ng-click="sendPOD()" ng-if="currentJob">
                                        <md-tooltip md-direction="bottom">Email Photo POD</md-tooltip>
                                        <md-icon md-font-icon="send" md-font-set="material-symbols-outlined"></md-icon>
                                    </md-button>
                                </div>

                                <div class="row-overflow" id="box-{{box.name}}-{{$index}}" layout="row"
                                     ng-if="boxes[box.name].showSearch">
                                    <md-button class="md-icon-button" ng-click="openSearch(box.name, $index)">
                                        <md-icon md-font-set="material-symbols-outlined"
                                                 ng-if="!showInput[box.name + '-' + $index]">search
                                        </md-icon>
                                        <md-icon md-font-set="material-symbols-outlined"
                                                 ng-if="showInput[box.name + '-' + $index]">close
                                        </md-icon>
                                    </md-button>

                                    <md-input-container class="md-block search-input-container" md-no-float
                                                        ng-if="showInput[box.name + '-' + $index]">
                                        <md-icon md-font-set="material-symbols-outlined ">search</md-icon>
                                        <input class="search-input" ng-change="updateTable()" ng-model="searchText"
                                               placeholder="Search jobs..." type="text">
                                    </md-input-container>
                                </div>

                                <div class="box-handle md-icon-button">
                                    <md-icon class="md-drag-button" md-font-set="material-symbols-outlined">
                                        drag_indicator
                                    </md-icon>
                                </div>

                            </div>
                        </md-toolbar>

                        <div class="box-content" ng-include="boxes[box.name].templateUrl"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id='draggingItems'></div>
</div>

<script>
    (function () {
        document.onkeydown = overrideKeyboardEvent;
        document.onkeyup = overrideKeyboardEvent;
        var keyIsDown = {};

        angular.element(document).on('focus', '.searchBox input', function () {
            angular.element(".results").fadeIn(100);
        });
        angular.element(document).on('blur', '.searchBox input', function () {
            angular.element(".results").fadeOut(100);
        });

        function overrideKeyboardEvent(e) {
            switch (e.type) {
                case "keydown":
                    if (!keyIsDown[e.keyCode]) {
                        keyIsDown[e.keyCode] = true;
                        // do key down stuff here
                        if (e.keyCode === 82 && e.ctrlKey) {
                            //location.reload();
                        }
                    }
                    break;
                case "keyup":
                    delete keyIsDown[e.keyCode];
                    // do key up stuff here
                    break;
            }
            disabledEventPropagation(e);
            if (e.keyCode === 68 && e.ctrlKey) {
                e.preventDefault();
                return false;
            }
            if (e.keyCode === 65 && e.ctrlKey) {
                e.preventDefault();
                return false;
            }
        }

        function disabledEventPropagation(e) {
            if (e.keyCode === 68 && e.ctrlKey) {
                if (e.stopPropagation) {
                    e.stopPropagation();
                } else if (window.event) {
                    window.event.cancelBubble = true;
                }
            }
        }

        angular.element(document).on('click', '.top-bar .btn-group .btn', function (event) {
            angular.element(this).parent().find('.topBarActive').removeClass('topBarActive');
            angular.element(this).addClass('topBarActive');
        });

        angular.element(document).ready(function () {
            var favicon = document.getElementById("favicon");
            favicon.setAttribute("href", "/Prebook.ico");
            var isDown = false;   // Tracks status of mouse button

            angular.element(document).mousedown(function () {
                isDown = true;      // When mouse goes down, set isDown to true
            })
                .mouseup(function () {
                    isDown = false;    // When mouse goes up, set isDown to false
                });

            var isOnRow = false;

            angular.element(document).on("mouseenter", ".activeTable .clickable-row", function (event) {
                if (event.ctrlKey) {
                    if (isDown) {        // Only change css if mouse is down
                        angular.element(this).addClass("active");
                    }
                }
            });

            angular.element(document).on("hover", ".activeTable .clickable-row", function (event) {
                isOnRow = true;
            });

            angular.element(document).on("mouseleave", ".activeTable .clickable-row", function (event) {
                isOnRow = false;
            });

            angular.element(document).on('click', '.box-content', function (event) {
                event.stopPropagation();
                if (isOnRow) {
                    angular.element(".activeTable .active").removeClass("active");
                }
            });
        });

        var mouseDown = 0;

        angular.element(document).on('mousedown', '.clickable-row', function (event) {
            var jobNo;
            if (angular.element(".activeTable .clickable-row.active").length > 1) {
                jobNo = angular.element(".activeTable .clickable-row.active").length + " Jobs";
            } else {
                jobNo = angular.element(this).attr("data-jobno");
            }

            if (mouseDown === 0) {
                mouseDown = 1;

                if (event.which === 1) {
                    if (event.ctrlKey) {
                        if (angular.element(this).hasClass("active")) {
                            angular.element(this).removeClass('active');
                        } else {
                            angular.element(this).addClass('active');
                        }
                    } else {
                        if (!angular.element(this).hasClass("active")) {
                            var group = angular.element(this).parents(".table-rows").attr("data-group");
                            angular.element('*[data-group="' + group + '"]').each(function () {
                                angular.element(this).find('.active').removeClass('active');
                            });

                            angular.element(this).addClass('active');
                        }
                    }

                    angular.element(".activeTable").removeClass("activeTable");
                    angular.element(this).parents(".table").addClass("activeTable");
                }

                if (!event.ctrlKey) {
                    if (angular.element(this).hasClass("draggable-row")) {
                        if (!angular.element(this).hasClass("active")) {
                            var group = angular.element(this).parents(".table-rows").attr("data-group");
                            angular.element('*[data-group="' + group + '"]').each(function () {
                                angular.element(this).find('.active').removeClass('active');
                            });
                            angular.element(this).addClass('active');
                        }
                        setTimeout(function () {
                            if (mouseDown === 1) {
                                angular.element("#draggingItems").show();
                                angular.element("#draggingItems").html(jobNo);

                                angular.element("#draggingItems").css({
                                    "top": event.pageY - 25,
                                    "left": event.pageX - 50
                                });
                                angular.element("#draggingItems").draggable();
                                angular.element("#draggingItems").trigger(event);
                            }
                        }, 200);
                    }
                }
            }
        });

        angular.element(document).on('mouseup', '.clickable-row', function (event) {
            if (event.which === 3) {
                angular.element(".rightActiveTable").removeClass("rightActiveTable");
                angular.element(this).parents(".table").addClass("rightActiveTable");
            }
            if (!event.ctrlKey) {
                if (!angular.element(this).hasClass("active")) {
                    var group = angular.element(this).parents(".table-rows").attr("data-group");

                    angular.element('*[data-group="' + group + '"]').each(function () {
                        angular.element(this).find('.active').removeClass('active');
                    });
                    angular.element(this).addClass('active');
                }
            }
        });

        angular.element(document).on('click', '.clickable-row', function (event) {
            event.stopPropagation();
        });

        angular.element(document).on("mouseup", function (ev) {
            angular.element("#draggingItems").hide();
            mouseDown = 0;
        });

        angular.element(document).on("keydown", function (e) {
            var code = (e.keyCode ? e.keyCode : e.which);
            if (code === 40) {
                angular.element(".activeTable").find(".active").removeClass("active").next().addClass("active").mouseup().click();
            } else if (code === 38) {
                angular.element(".activeTable").find(".active").removeClass("active").prev().addClass("active").mouseup().click();
            }
        });
    })();
</script>
