<md-progress-linear
        md-mode="indeterminate"
        ng-show="ctrl.repriceListLoading"
        class="md-primary">
</md-progress-linear>

<jobs-list
        ng-if="!ctrl.repriceListLoading && (ctrl.jobListReprice || ctrl.jobListReprice.length > 0)"
        jobs="ctrl.jobListReprice"
        selected-job="ctrl.currentJob"
        on-job-select="ctrl.handleJobSelection(job)"
        on-job-action="ctrl.handleJobAction(action, job, params)"
        get-context-menu-options="ctrl.getJobContextMenuOptions()"
        job-list-type="ctrl.nationwideRepriceJobList">
</jobs-list>
