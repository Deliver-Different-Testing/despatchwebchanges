<!-- Flight/Agent Data Table - React Component -->
<flight-agent-data-table-react
    is-delivery-job-type="ctrl.isDeliveryJobType"
    current-job="ctrl.currentJob"
    flights-loading="ctrl.flightsLoading"
    agents-loading="ctrl.agentsLoading"
    flight-options="ctrl.flightOptions"
    filtered-flight-options="ctrl.filteredFlightOptions"
    flight-search-text="ctrl.flightSearchText"
    flight-message="ctrl.flightMessage"
    agent-options="ctrl.agentOptions"
    agent-message="ctrl.agentMessage"
    active-airline-options="ctrl.activeAirlineOptions"
    selected-airline="ctrl.selectedAirline"
    outbound-airport-options="ctrl.outboundAirportOptions"
    inbound-airport-options="ctrl.inboundAirportOptions"
    selected-outbound-airport="ctrl.selectedOutboundAirport"
    selected-inbound-airport="ctrl.selectedInboundAirport"
    show-no-job-selected-message="ctrl.showNoJobSelectedMessage"
    show-job-has-assigned-flight-message="ctrl.showJobHasAssignedFlightMessage"
    show-missing-airport-info-message="ctrl.showMissingAirportInfoMessage"
    show-no-flights-available-message="ctrl.showNoFlightsAvailableMessage"
    show-flight-list="ctrl.showFlightList"
    show-no-agent-job-selected-message="ctrl.showNoAgentJobSelectedMessage"
    show-job-has-assigned-agent-message="ctrl.showJobHasAssignedAgentMessage"
    show-not-delivery-job-message="ctrl.showNotDeliveryJobMessage"
    show-no-agents-available-message="ctrl.showNoAgentsAvailableMessage"
    show-agent-list="ctrl.showAgentList"
    on-flight-search-change="ctrl.onFlightSearchChange(searchText)"
    on-filter-flights-by-airline="ctrl.filterFlightsByAirline(airline)"
    on-outbound-airport-change="ctrl.onOutboundAirportSelectionChangedReact(airport)"
    on-inbound-airport-change="ctrl.onInboundAirportSelectionChangedReact(airport)"
    on-add-flight-to-job="ctrl.addFlightToJobReact($event, flight)"
    on-open-flight-more-info="ctrl.openFlightMoreInfoReact($event, flight)"
    on-load-more-flights="ctrl.loadFlights()"
    on-load-next-day-flights="ctrl.loadNextDayFlights()"
    on-add-agent-to-job="ctrl.addAgentToJobReact($event, agent)"
    on-send-quote-request="ctrl.sendQuoteRequestReact($event, agent)"
    on-open-agent-more-info="ctrl.openAgentMoreInfoReact($event, agent)"
    on-open-agent-search-dialog="ctrl.openAgentSearchDialogReact($event)"
    on-open-recovery-agent-dialog="ctrl.openRecoveryAgentDialogReact($event)"
    format-airport-code-for-dropdown="ctrl.formatAirportCodeForDropdown(text)"
    get-connection-time="ctrl.getConnectionTime(firstSegment, secondSegment)"
    format-minutes-to-time="ctrl.formatMinutesToTimeReact(minutes)">
</flight-agent-data-table-react>
