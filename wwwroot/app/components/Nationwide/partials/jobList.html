<md-progress-linear
        md-mode="indeterminate"
        ng-if="ctrl.jobListLoading"
        class="md-primary">
</md-progress-linear>

<jobs-list
        jobs="ctrl.jobList"
        selected-job="ctrl.currentJob"
        on-job-select="ctrl.selectJob(job)"
        on-job-dispatch="ctrl.handleJobDispatch(job, courierId)"
        on-job-action="ctrl.handleJobAction(action, job, params)"
        get-context-menu-options="ctrl.getContextMenuOptions(job)"
        on-refresh="ctrl.getJobList([ctrl.JobDataType.NEW])"
        on-load-more-jobs="ctrl.handleLoadMoreNationwideJobs(page, pageSize)"
        enable-virtual-scrolling="true"
        job-list-type="ctrl.nationwideJobList"
        total-jobs-count="ctrl.totalJobCount"
        on-search-change="ctrl.updateJobSearchText(searchText, jobType)">
</jobs-list>
