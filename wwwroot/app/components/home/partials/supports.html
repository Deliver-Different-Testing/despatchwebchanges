<div class="droppable-box nationwide-job-list">
    <dfrnt-loader
            is-loading="ctrl.supportsLoading"
            icon-name="'support'">
    </dfrnt-loader>

    <md-list ng-if="!ctrl.supportsLoading && ctrl.supports && ctrl.supports.length > 0">
        <task-item-component
                ng-repeat="support in ctrl.supports | filter: box.searchBox"
                task="support"
                config="ctrl.supportItemConfig"
                on-task-updated="ctrl.getSupports()">
        </task-item-component>
    </md-list>

    <no-data
            ng-if="!ctrl.supportsLoading && (!ctrl.supports || ctrl.supports.length === 0)"
            title="No Supports Available"
            message="There are no support items to display at this time."
            icon="support"
            show-action="false">
    </no-data>
</div>
