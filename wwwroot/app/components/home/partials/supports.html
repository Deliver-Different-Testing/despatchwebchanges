<md-progress-linear
        md-mode="indeterminate"
        ng-show="ctrl.supportsLoading"
        class="md-primary">
</md-progress-linear>

<div class="droppable-box nationwide-job-list">
    <div ng-if="!ctrl.supportsLoading && ctrl.filteredSupports && ctrl.filteredSupports.length > 0">
        <div class="md-table-footer-content">
            <div flex></div>

            <div class="tasks-status-summary">
                <md-button class="md-button status-chip total" ng-click="ctrl.filterTasks('all')"
                           ng-disabled="ctrl.supports.length === 0">
                    <md-icon md-font-set="material-symbols-outlined">article</md-icon>
                    <span>{{ctrl.supports.length || 0}}</span>
                    <span class="status-label">Total</span>
                </md-button>
                <md-button class="md-button status-chip mine" ng-click="ctrl.filterTasks('mine')"
                           ng-disabled="ctrl.getTasksStatusCount('mine') === 0">
                    <md-icon md-font-set="material-symbols-outlined">person</md-icon>
                    <span>{{ctrl.getTasksStatusCount('mine')}}</span>
                    <span class="status-label optional-label">Mine</span>
                </md-button>
                <md-button class="md-button status-chip unassigned" ng-click="ctrl.filterTasks('unassigned')"
                           ng-disabled="ctrl.getTasksStatusCount('unassigned') === 0">
                    <md-icon md-font-set="material-symbols-outlined">person_off</md-icon>
                    <span>{{ctrl.getTasksStatusCount('unassigned')}}</span>
                    <span class="status-label optional-label">Unassigned</span>
                </md-button>
                <md-button class="md-button status-chip newest" ng-click="ctrl.filterTasks('newest')"
                           ng-disabled="ctrl.supports.length === 0">
                    <md-icon md-font-set="material-symbols-outlined">arrow_downward</md-icon>
                    <span>{{ctrl.supports.length || 0}}</span>
                    <span class="status-label optional-label">Newest</span>
                </md-button>
                <md-button class="md-button status-chip oldest" ng-click="ctrl.filterTasks('oldest')"
                           ng-disabled="ctrl.supports.length === 0">
                    <md-icon md-font-set="material-symbols-outlined">arrow_upward</md-icon>
                    <span>{{ctrl.supports.length || 0}}</span>
                    <span class="status-label optional-label">Oldest</span>
                </md-button>
            </div>
        </div>

        <md-divider></md-divider>

        <md-list>
            <task-item-component
                    ng-repeat="support in ctrl.filteredSupports | filter: box.searchBox"
                    task="support"
                    config="ctrl.supportItemConfig"
                    on-task-updated="ctrl.getSupports()"
                    on-task-click="ctrl.selectSupportJobDetail(support)">
            </task-item-component>
        </md-list>
    </div>

    <no-data
            ng-if="!ctrl.supportsLoading && (!ctrl.filteredSupports || ctrl.filteredSupports.length === 0)"
            title="No Supports Available"
            message="There are no support items matching your filter criteria."
            icon="support"
            show-action="false">
    </no-data>
</div>
