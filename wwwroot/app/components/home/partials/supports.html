<div class="droppable-box nationwide-job-list">
    <dfrnt-loader
            is-loading="ctrl.supportsLoading"
            icon-name="'support'">
    </dfrnt-loader>

    <div class="current-filter-label" ng-if="!ctrl.supportsLoading && ctrl.supportsFilter">
        <span>Filter: {{ctrl.getSupportsFilterLabel()}}</span>
    </div>

    <md-list ng-if="!ctrl.supportsLoading && ctrl.filteredSupports && ctrl.filteredSupports.length > 0">
        <task-item-component
                ng-repeat="support in ctrl.filteredSupports | filter: box.searchBox"
                task="support"
                config="ctrl.supportItemConfig"
                on-task-updated="ctrl.getSupports()"
                on-task-click="ctrl.selectSupportJobDetail(task)">
        </task-item-component>
    </md-list>

    <no-data
            ng-if="!ctrl.supportsLoading && (!ctrl.filteredSupports || ctrl.filteredSupports.length === 0)"
            title="No Supports Available"
            message="There are no support items matching your filter criteria."
            icon="support"
            show-action="false">
    </no-data>
</div>
