<md-progress-linear
        md-mode="indeterminate"
        ng-show="ctrl.isLoadingData"
        class="md-primary">
</md-progress-linear>

<jobs-list
        jobs="ctrl.jobList"
        selected-job="ctrl.currentJob"
        on-job-select="ctrl.selectJob(job)"
        on-job-dispatch="ctrl.handleJobDispatch(job, courierId)"
        on-job-action="ctrl.handleJobAction(action, job, params)"
        get-context-menu-options="ctrl.getJobContextMenuOptions()"
        on-refresh="ctrl.getData()"
        job-list-type="ctrl.dispatchListName"
        on-load-more-jobs="ctrl.handleLoadMoreJobs(page, pageSize)"
        enable-virtual-scrolling="true"
        total-jobs-count="ctrl.totalJobCount"
        on-search-change="ctrl.updateJobSearchText(searchText)">
</jobs-list>
