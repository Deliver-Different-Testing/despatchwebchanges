<!-- Pot Couriers Component -->
<div class="job-list-container">

    <!-- Loading Indicator -->
    <dfrnt-loader
            is-loading="ctrl.potentialCouriersLoading"
            icon-name="'groups'">
    </dfrnt-loader>

    <!-- Pot Couriers Table -->
    <div class="job-list-table" ng-if="!ctrl.potentialCouriersLoading && ctrl.potentialCouriers.length > 0">
        <!-- Table Headers -->
        <div class="table-headings sticky-header">
            <table>
                <thead class="thead-dark no select">
                <tr>
                    <th ng-click="ctrl.orderList('jobList', header.key)" ng-repeat="header in ctrl.potentialCouriersHeaders">
                        <i class="material-symbols-outlined job-table-icon"
                           ng-if="ctrl.sort.jobList == header.key">arrow_drop_down</i>
                        <i class="material-symbols-outlined job-table-icon"
                           ng-if="ctrl.sort.jobList == 'd-' + header.key">arrow_drop_up</i>
                        {{header.label}}
                    </th>
                </tr>
                </thead>
            </table>
        </div>

        <table class="table table-striped table-responsive table-rows md-truncate" data-group="couriers"
               id="potentialCouriers">
            <tbody>
            <tr $index by class="clickable-row droppable-row" context-menu="ctrl.courierMenu" data-courier="{{courier.courier}}"
                ng-click="ctrl.selectPotentialCourier(courier)" ng-repeat="courier in ctrl.potentialCouriers"
                track>
                <td>{{courier.code}}&nbsp;{{courier.firstName}}</td>
                <td>{{courier.ruleNumber}}</td>
                <td>{{courier.reason}}</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- No Data Message -->
    <div class="no-data" ng-if="!ctrl.potentialCouriersLoading && (!ctrl.potentialCouriers || ctrl.potentialCouriers.length === 0)">
        <div class="content">
            <div class="icon">
                <md-icon md-font-set="material-symbols-outlined">groups</md-icon>
            </div>
            <div class="text">
                Please Select a Job or Courier
            </div>
        </div>
    </div>
</div>
