<jobs-list
        ng-if="ctrl.jobsCurrentList && ctrl.jobsCurrentList.length > 0"
        jobs="ctrl.jobsCurrentList"
        selected-job="ctrl.selectedJob"
        on-job-select="ctrl.handleJobSelection(job)"
        on-job-dispatch="ctrl.handleJobDispatch(job, courierId)"
        on-job-action="ctrl.handleJobAction(action, job, params)"
        get-context-menu-options="ctrl.getJobContextMenuOptions()"
        dispatch-state="ctrl.dispatchState"
        query-params="ctrl.queryParams"
        refresh-interval="30000"
        job-list-type="ctrl.currentWorkListName">
</jobs-list>

<no-data
        ng-if="!ctrl.jobsCurrentList"
        title="No Courier Selected"
        message="Please Select a Courier to View Available Work"
        icon="local_shipping"
        show-action="false">
</no-data>
