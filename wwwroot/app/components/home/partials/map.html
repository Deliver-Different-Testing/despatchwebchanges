<dispatch-map
        class="full-height-map"
        current-job="ctrl.currentJob"
        jobs="ctrl.mapJobList"
        map-center="ctrl.mapCenter"
        map-zoom="ctrl.mapZoom"
        on-marker-click="ctrl.selectJob(job)"
        show-available-couriers="true">
</dispatch-map>

<style>
    dispatch-map {
        display: block;
        flex: 1;
        height: 100% !important;
        min-height: 0;
        position: relative;
    }

    .full-height-map {
        height: 100% !important;
    }

    .dispatch-map-component {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        height: 100% !important;
        width: 100%;
    }

    .dispatch-map-container {
        height: 100% !important;
    }

    /* Fix for the Google Map container */
    .map-wrapper,
    ng-map,
    .gm-style {
        height: 100% !important;
        width: 100% !important;
    }

    /* Handle resize in progress */
    .box.resizable-dragging .box-content {
        pointer-events: none; /* Prevents map interaction during resize */
    }

    /* Add transition for smoother resizing */
    .dispatch-map-component,
    .dispatch-map-container,
    .map-wrapper {
        transition: height 0.1s ease;
    }
</style>
