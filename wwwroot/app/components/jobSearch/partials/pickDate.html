<div class="search-criteria">
    <!-- Date Range -->
    <div class="criteria-group">
        <label class="group-label">Date Range</label>
        <div class="date-buttons">
            <md-button class="date-btn"
                       ng-class="{'md-primary md-raised': ctrl.dateSearchRange === 'today'}"
                       ng-click="ctrl.dateSearchRange = 'today'; ctrl.onSearchRangeChange('today')">
                Today
            </md-button>
            <md-button class="date-btn"
                       ng-class="{'md-primary md-raised': ctrl.dateSearchRange === 'fortnight'}"
                       ng-click="ctrl.dateSearchRange = 'fortnight'; ctrl.onSearchRangeChange('fortnight')">
                Fortnight
            </md-button>
            <md-button class="date-btn"
                       ng-class="{'md-primary md-raised': ctrl.dateSearchRange === 'month'}"
                       ng-click="ctrl.dateSearchRange = 'month'; ctrl.onSearchRangeChange('month')">
                Month
            </md-button>
            <md-button class="date-btn"
                       ng-class="{'md-primary md-raised': ctrl.dateSearchRange === 'custom'}"
                       ng-click="ctrl.dateSearchRange = 'custom'; ctrl.onSearchRangeChange('custom')">
                Custom
            </md-button>
        </div>
        <div class="date-range" ng-if="ctrl.dateSearchRange === 'custom'">
            <div class="date-field">
                <label>From</label>
                <custom-date-picker
                        date-time="ctrl.searchCriteria.from_date"
                        show-date="true"
                        show-time="false"
                        on-change="ctrl.updateFromDatePicker(dateTime)">
                </custom-date-picker>
            </div>
            <div class="date-field">
                <label>To</label>
                <custom-date-picker
                        date-time="ctrl.searchCriteria.to_date"
                        show-date="true"
                        show-time="false"
                        on-change="ctrl.updateToDatePicker(dateTime)">
                </custom-date-picker>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="criteria-group">
        <label class="group-label">Clients</label>
        <md-chips ng-model="ctrl.searchCriteria.clients"
                  md-autocomplete-snap
                  md-require-match="true">
            <md-autocomplete
                    md-search-text="ctrl.clientSearchText"
                    md-items="item in ctrl.clientQuerySearch(ctrl.clientSearchText)"
                    md-item-text="item.text"
                    md-min-length="2"
                    placeholder="Search clients...">
                <md-item-template>
                    <span md-highlight-flags="^i" md-highlight-text="ctrl.clientSearchText">{{item.text}}</span>
                </md-item-template>
            </md-autocomplete>
            <md-chip-template>
                <span>{{$chip.text}}</span>
            </md-chip-template>
        </md-chips>
    </div>

    <div class="criteria-group">
        <label class="group-label">Couriers</label>
        <md-chips ng-model="ctrl.searchCriteria.couriers"
                  md-autocomplete-snap
                  md-require-match="true">
            <md-autocomplete
                    md-search-text="ctrl.courierSearchText"
                    md-items="item in ctrl.courierQuerySearch(ctrl.courierSearchText)"
                    md-item-text="item.text"
                    md-min-length="1"
                    placeholder="Search couriers...">
                <md-item-template>
                    <span md-highlight-flags="^i" md-highlight-text="ctrl.courierSearchText">{{item.text}}</span>
                </md-item-template>
            </md-autocomplete>
            <md-chip-template>
                <span>{{$chip.text}}</span>
            </md-chip-template>
        </md-chips>
    </div>

    <div class="criteria-group">
        <label class="group-label">Speeds</label>
        <md-chips ng-model="ctrl.searchCriteria.speeds"
                  md-autocomplete-snap
                  md-require-match="true">
            <md-autocomplete
                    md-search-text="ctrl.speedSearchText"
                    md-items="item in ctrl.speedQuerySearch(ctrl.speedSearchText)"
                    md-item-text="item.text"
                    md-min-length="1"
                    placeholder="Search speeds...">
                <md-item-template>
                    <span md-highlight-flags="^i" md-highlight-text="ctrl.speedSearchText">{{item.text}}</span>
                </md-item-template>
            </md-autocomplete>
            <md-chip-template>
                <span>{{$chip.text}}</span>
            </md-chip-template>
        </md-chips>
    </div>

    <!-- Text Search -->
    <div class="criteria-group">
        <label class="group-label">Job Number</label>
        <input type="text"
               class="search-input"
               ng-model="ctrl.searchCriteria.job"
               ng-keyup="$event.keyCode === 13 && ctrl.refreshAllData()"
               placeholder="Enter job number">
    </div>

    <div class="criteria-group">
        <label class="group-label">General Search</label>
        <input type="text"
               class="search-input"
               ng-model="ctrl.searchCriteria.wild"
               ng-keyup="$event.keyCode === 13 && ctrl.refreshAllData()"
               placeholder="Address, name, reference...">
    </div>

    <!-- Actions -->
    <div class="criteria-actions">
        <md-button class="md-raised md-primary action-search" ng-click="ctrl.refreshAllData()">
            Search
        </md-button>
        <div class="action-secondary">
            <md-button class="md-icon-button" ng-click="ctrl.downloadJobList()" aria-label="Download">
                <md-icon md-font-set="material-symbols-outlined">download</md-icon>
                <md-tooltip>Download</md-tooltip>
            </md-button>
            <md-button class="md-icon-button"
                       ng-click="ctrl.downloadClientJobsReport()"
                       ng-disabled="!ctrl.isClientJobsReportEnabled()"
                       aria-label="Report">
                <md-icon md-font-set="material-symbols-outlined">description</md-icon>
                <md-tooltip>Client Report</md-tooltip>
            </md-button>
            <md-button class="md-icon-button" ng-click="ctrl.uploadJobList($event)" aria-label="Upload">
                <md-icon md-font-set="material-symbols-outlined">upload</md-icon>
                <md-tooltip>Upload Prices</md-tooltip>
            </md-button>
        </div>
    </div>
</div>
