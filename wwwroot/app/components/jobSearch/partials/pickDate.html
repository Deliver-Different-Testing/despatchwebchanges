<search-criteria-panel-react
    date-search-range="ctrl.dateSearchRange"
    from-date="ctrl.searchCriteria.from_date"
    to-date="ctrl.searchCriteria.to_date"
    on-search-range-change="ctrl.onSearchRangeChange(range)"
    on-from-date-change="ctrl.updateFromDatePicker(dateTime)"
    on-to-date-change="ctrl.updateToDatePicker(dateTime)"
    on-criteria-change="ctrl.updateSearchField(field, value)"
    on-search="ctrl.refreshAllData()"
    on-download="ctrl.downloadJobList()"
    on-client-report="ctrl.downloadClientJobsReport()"
    on-price-detail-report="ctrl.downloadPriceDetailReport()"
    on-upload="ctrl.uploadJobList($event)"
    on-client-search="ctrl.clientQuerySearch(searchText)"
    on-courier-search="ctrl.courierQuerySearch(searchText)"
    on-speed-search="ctrl.speedQuerySearch(searchText)">
</search-criteria-panel-react>
