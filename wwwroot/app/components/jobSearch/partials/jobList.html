<md-progress-linear
        md-mode="indeterminate"
        ng-show="ctrl.isJobListLoading"
        class="md-primary">
</md-progress-linear>

<jobs-list
        ng-if="ctrl.jobList || ctrl.jobList.length > 0"
        jobs="ctrl.jobList"
        selected-job="ctrl.currentJob"
        on-job-select="ctrl.onJobSelect(job)"
        on-job-dispatch="ctrl.handleJobDispatch(job, courierId)"
        on-load-more-jobs="ctrl.handleLoadMoreJobs(page, pageSize)"
        enable-virtual-scrolling="true"
        get-context-menu-options="ctrl.getContextMenuOptions(job)"
        on-refresh="ctrl.refreshData()"
        job-list-type="ctrl.jobListType">
</jobs-list>

<no-data
        ng-if="!ctrl.jobList || ctrl.jobList.length === 0"
        title="No Jobs Available"
        message="There are currently no jobs that match your criteria."
        icon="list_alt"
        show-action="false">
</no-data>
